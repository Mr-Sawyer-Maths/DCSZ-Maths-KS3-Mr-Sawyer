<style>

<body>
<main id="app"></main>
<div id="print"></div>
<!-- Optional extra word problems. If packs.js sits next to this file it is loaded; if not, nothing breaks. -->
<script src="packs.js" onerror="void 0"></script>
<script>
'use strict';
/* ============================================================================
   MATHS PRACTICE  ·  one file, no server. Progress is saved in this browser.
   The cog opens the progress screen. Changing levels and the teacher tools
   need the teacher PIN (default 6767; change it in Tools).
   ============================================================================ */
const CONFIG = {
  pin: '6767',          // default teacher PIN for a fresh device
  typedN: 5,            // typed quick-check questions per round
  bookN: 8,             // written (in the book) questions per round
  passAcc: 0.8,         // round counts as a pass at this accuracy (and not rated "tough")
  gameSecs: 180,        // length of the reward game
  autoSecs: 3,          // whole-number fluency: an answer counts as automatic within this many seconds (small numbers; see autoLimit)
  autoShare: 0.8,       // share of typed fluency answers that must be automatic for a round to count towards securing the level
  checkLongSecs: 120,   // after this long, the Fluency challenge offers "These questions take me too long"
  checkCap: {fluency: 16, skill: 6},   // most questions the level check asks in one area
  divAfter: 'M6',       // division joins the Fluency challenge only if multiplication reached this level (the tougher tables)
  quizN: 10,            // questions in the quick quiz after a worksheet
  quizPass: 0.9,        // the quick quiz secures a level at this accuracy (and, for fluency, autoShare automatic)
  links: [              // "stretch" links shown to students working at the top levels
    ['Transum games and puzzles', 'https://www.transum.org/Software/Game/'],
    ['Beast Academy: All Ten', 'https://beastacademy.com/all-ten'],
    ['NRICH problems', 'https://nrich.maths.org/'],
    ['Corbettmaths 5-a-day', 'https://corbettmaths.com/5-a-day/'],
  ],
};

// ---------- helpers ----------
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const nstr = x => String(parseFloat(Number(x).toFixed(6)));
const F = (n, d) => `{${n}/${d}}`;
const fs = (n, d) => { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; };
const pad2 = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => dstr();
const dOff = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const nice = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}); };
const fmt = s => esc(s).replace(/\{(?:(-?\d+) )?([^{}\/ ]+)\/([^{}\/ ]+)\}/g, (_, w, n, d) => `${w || ''}<span class="fr"><span>${n}</span><span>${d}</span></span>`).replace(/\^□/g, '<sup><span class="box"></span></sup>').replace(/□/g, '<span class="box"></span>').replace(/\n/g, '<br>');
const q = (t, a, o = {}) => ({q: t, a, ...o});
const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(d => SUPS[d]).join('');
const mmss = x => { x = Math.round(x); return Math.floor(x / 60) + ':' + pad2(x % 60); };

// ---------- answers ----------
function parseVal(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/[£%,°]/g, '').replace(/\s*[a-zA-Z]+$/, '').trim(); let m;
  if ((m = s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) { const w = +m[2], n = +m[3], d = +m[4]; if (!d) return null; return {n: (m[1] ? -1 : 1) * (w * d + n), d, form: 'mixed', low: gcd(n, d) === 1 && n < d}; }
  if ((m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/))) { const n = +m[1], d = +m[2]; if (!d) return null; return {n, d, form: 'frac', low: gcd(n, d) === 1}; }
  if ((m = s.match(/^(-?)(\d*)\.(\d+)$/))) { const d = 10 ** m[3].length, n = (+(m[2] || 0)) * d + +m[3]; return {n: (m[1] ? -1 : 1) * n, d, form: 'dec'}; }
  if (/^-?\d+$/.test(s)) return {n: +s, d: 1, form: 'int'};
  return null;
}
/* Ratio answers (16 Nov 2026). A question's answer is a ratio when Q.a is a string with a colon, stored without spaces: '3:4', '8:12:15'.
   It must be in its simplest form (whole numbers, no common factor) unless Q.form says otherwise: 'one1' wants 1 : n, 'n1' wants n : 1,
   'any' accepts any equivalent ratio. Right but not in the form asked for gets a second try, as with fractions. Parts in the wrong
   order are a miss, with a note. Any question can carry notes: {'2/3': 'text'}, shown when that wrong answer is typed (still a miss). */
const isRatio = a => typeof a === 'string' && a.includes(':');
const ratioTxt = a => a.split(':').join(' : ');

    if (f === 'n1' && v[v.length - 1] !== 1) return {retry: 'Right ratio. Now make the last part 1.'};
    if (f === 'simplest') {
      if (!v.every(Number.isInteger)) return {retry: 'Right ratio. Now make every part a whole number.'};

sk('F5', 'F', 'Tenths and hundredths as decimals', 'The first decimal place is tenths, the second is hundredths. 0.07 is seven hundredths.', () => { const t = ri(1, 9); let h = ri(11, 99); if (h % 10 === 0) h++; return pick([q(`Write 0.${t} as a fraction`, `${t}/10`), q(`Write ${F(t, 10)} as a decimal`, t / 10), q(`Write ${F(h, 100)} as a decimal`, h / 100), q(`Write 0.0${t} as a fraction`, `${t}/100`), q(`Write 0.${h} as a fraction`, `${h}/100`), q(`Write ${F(t, 100)} as a decimal`, t / 100)]); });
sk('F6', 'F', 'Converting fractions, decimals, percentages', 'Percent means "out of 100". 0.25 is 25 hundredths, so 25%, which simplifies to one quarter.', () => { const [n, d] = pick(FDP), dec = nstr(n / d), pct = nstr(100 * n / d); return pick([q(`Write ${F(n, d)} as a decimal`, n / d), q(`Write ${F(n, d)} as a percentage`, 100 * n / d, {suf: '%'}), q(`Write ${dec} as a percentage`, 100 * n / d, {suf: '%'}), q(`Write ${dec} as a fraction in its simplest form`, `${n}/${d}`, {form: 'simplest'}), q(`Write ${pct}% as a decimal`, n / d), q(`Write ${pct}% as a fraction in its simplest form`, `${n}/${d}`, {form: 'simplest'})]); });
sk('F7', 'F', 'Percentages of amounts: 50%, 10%, 25%, 1%', '50% is half. 10% is divide by 10. 25% is half and half again. 1% is divide by 100.', () => { const p = pick([50, 10, 25, 1]), A = p === 50 ? ri(2, 60) * 2 : p === 10 ? ri(2, 40) * 10 : p === 25 ? ri(1, 25) * 4 : ri(1, 9) * 100; return q(`${p}% of ${A}`, A * p / 100); });

sk('F9', 'F', 'Comparing fractions, decimals, percentages', 'Turn them into the same form first. Decimals are usually easiest to compare.', () => { for (;;) { const a = pick(FDP), b = pick(FDP); if (a[0] * b[1] === b[0] * a[1]) continue; const forms = shuf([0, 1, 2]), sh = (f, k) => k === 0 ? F(f[0], f[1]) : k === 1 ? nstr(f[0] / f[1]) : nstr(100 * f[0] / f[1]) + '%'; const s1 = sh(a, forms[0]), s2 = sh(b, forms[1]); return q(`Which is larger: ${s1} or ${s2}?`, a[0] / a[1] > b[0] / b[1] ? s1 : s2, {kind: 'choice', opts: [s1, s2]}); } });
sk('F10', 'F', 'Add and subtract fractions: same denominator', 'The denominator stays the same. Just add or subtract the tops.', () => { const d = pick([5, 7, 8, 9, 10, 11, 12]), a = ri(1, d - 2), b = ri(1, d - 1 - a); return pick([q(`${F(a, d)} + ${F(b, d)}`, fs(a + b, d)), q(`${F(a + b, d)} − ${F(a, d)}`, fs(b, d))]); });
sk('F11', 'F', 'Add and subtract fractions: different denominators', 'Make the denominators the same first, using equivalent fractions. Then add or subtract the tops.', () => { for (;;) { const [d1, d2] = pick([[2, 3], [2, 4], [3, 4], [2, 5], [3, 6], [4, 8], [2, 6], [3, 5], [4, 5], [5, 10], [2, 8], [3, 9], [4, 6]]), n1 = ri(1, d1 - 1), n2 = ri(1, d2 - 1), L = d1 * d2, s = n1 * d2 + n2 * d1, df = n1 * d2 - n2 * d1; const o = []; if (s < L) o.push(q(`${F(n1, d1)} + ${F(n2, d2)}`, fs(s, L))); if (df > 0) o.push(q(`${F(n1, d1)} − ${F(n2, d2)}`, fs(df, L))); if (o.length) return pick(o); } });
sk('F12', 'F', 'Mixed numbers and improper fractions', 'How many whole ones can you make? Seven thirds is two whole ones (six thirds) and one third left.', () => { for (;;) { const d = ri(2, 9), w = ri(1, 5), n = ri(1, d - 1); if (gcd(n, d) !== 1) continue; return pick([q(`Write ${F(w * d + n, d)} as a mixed number`, `${w} ${n}/${d}`, {form: 'mixed'}), q(`Write {${w} ${n}/${d}} as an improper fraction`, `${w * d + n}/${d}`, {form: 'improper'})]); } });
sk('F13', 'F', 'Multiplying fractions', 'Multiply the tops, multiply the bottoms, then simplify.', () => { const [a, b] = pick(BASE), [c, d] = pick(BASE), k = ri(2, 6); return pick([q(`${F(a, b)} × ${F(c, d)}`, fs(a * c, b * d), {form: 'simplest'}), q(`${F(a, b)} × ${F(c, d)}`, fs(a * c, b * d), {form: 'simplest'}), q(`${F(a, b)} × ${k}`, fs(a * k, b), {form: 'simplest'})]); });

sk('F15', 'F', 'Adding and subtracting decimals', 'Line up the decimal points. Fill gaps with zeros: 5 − 1.36 is 5.00 − 1.36.', () => { const A = ri(11, 99) * 10, B = ri(101, 899); if (B % 10 === 0) return q(`${nstr(A / 100)} + ${nstr((B + 3) / 100)}`, (A + B + 3) / 100); const n = ri(Math.ceil(B / 100) + 1, 12); return pick([q(`${nstr(A / 100)} + ${nstr(B / 100)}`, (A + B) / 100), q(`${nstr(Math.max(A, B) / 100)} − ${nstr(Math.min(A, B) / 100)}`, Math.abs(A - B) / 100), q(`${n} − ${nstr(B / 100)}`, (n * 100 - B) / 100)]); });

sk('F17', 'F', 'Writing one amount as a percentage of another', 'Write it as a fraction, then make the denominator 100. 12 out of 40 is 6 out of 20, which is 30 out of 100.', () => { const d = pick([10, 20, 25, 50, 5, 4, 40, 200]), n = d === 40 ? 2 * ri(1, 19) : d === 200 ? 2 * ri(1, 99) : ri(1, d - 1); return q(`Write ${n} out of ${d} as a percentage`, 100 * n / d, {suf: '%'}); });

/* ---- Ratio (group R, area RA). Plan: claude/section-ratio-outline.md. Ids R1 to R11 are fixed by that outline; never rename them.
   Engine pieces built 16 Nov 2026 (ratio answers, notes, drawn counters, book-only answers, mixBook, Stretch); levels 17 Nov 2026.

const COPRIME = [[1, 2], [1, 3], [2, 3], [1, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5], [1, 6], [5, 6], [2, 7], [3, 7], [4, 7], [5, 7], [3, 8], [5, 8], [7, 8], [2, 9], [4, 9], [5, 9], [7, 9]];
const rord = ([a, b]) => Math.random() < .5 ? [a, b] : [b, a];
sk('R3', 'RA', 'Simplifying ratios', 'Divide both parts by the same number. Keep going until nothing else divides into both. 18 : 24: divide by 6 to get 3 : 4. Dividing by the highest common factor does it in one go.',
  () => { const [a, b] = rord(pick(COPRIME)), m = ri(2, 12); return q(`Simplify ${a * m} : ${b * m}`, `${a}:${b}`); },
  {chain: () => { const [a, b] = rord(pick(COPRIME.filter(([x, y]) => y <= 5))); return [2, 4, 8].map(m => q(`Simplify ${a * m} : ${b * m}`, `${a}:${b}`)).concat(q(`Simplify ${b * 8} : ${a * 8}`, `${b}:${a}`)); }});
// Helpers for the Ratio levels. rsimp: a ratio of whole numbers in simplest form, as an answer string ('3:4').
const rsimp = (...p) => { const g = p.reduce(gcd); return p.map(x => x / g).join(':'); };
const RTRIPLES = [[1, 2, 3], [2, 3, 4], [1, 3, 4], [2, 3, 5], [1, 2, 5], [3, 4, 5], [1, 4, 5], [2, 5, 6], [1, 3, 5], [2, 3, 7], [3, 5, 7], [1, 2, 4]];
const rmoney = v => Number.isInteger(v) ? '£' + v : '£' + v.toFixed(2);
// Things that come in two kinds: [first, second, where, all of them]
const RPAIRS = [['boys', 'girls', 'In a class', 'students'], ['cats', 'dogs', 'At an animal shelter', 'animals'], ['adults', 'children', 'On a school trip', 'people'],
  ['red cars', 'blue cars', 'In a car park', 'cars'], ['apples', 'oranges', 'In a fruit box', 'pieces of fruit'], ['fiction books', 'non-fiction books', 'On a shelf', 'books']];
const RSHAPES = ['circle', 'triangle', 'square', 'star'], RPL = {circle: 'circles', triangle: 'triangles', square: 'squares', star: 'stars'};
const rcap = s => s[0].toUpperCase() + s.slice(1);
const RCOL = ['red', 'blue', 'green', 'yellow'];

sk('R1', 'RA', 'Writing a ratio', 'The order matters. "Red to blue" means red first. 5 red and 8 blue is 5 : 8, and blue to red is 8 : 5.',
  () => {
    const r = Math.random();
    if (r < .4) {      // drawn counters: two kinds, never sharing a factor
      const [s1, s2] = shuf(RSHAPES).slice(0, 2); let a, b; do { a = ri(2, 9); b = ri(2, 11); } while (a === b || gcd(a, b) > 1);
      const qq = `Write the ratio of ${RPL[s1]} to ${RPL[s2]}.`;
      return q(qq, `${a}:${b}`, {pic: [[a, s1], [b, s2]], qw: `There are ${a} ${RPL[s1]} and ${b} ${RPL[s2]}. ${qq}`});
    }
    if (r < .6) {      // counters in a bag, asked either way round
      const [c1, c2] = shuf(RCOL).slice(0, 2); let a, b; do { a = ri(2, 15); b = ri(2, 15); } while (a === b || gcd(a, b) > 1);
      return Math.random() < .5 ? q(`A bag has ${a} ${c1} counters and ${b} ${c2} counters. Write the ratio of ${c1} to ${c2}.`, `${a}:${b}`)
        : q(`A bag has ${a} ${c1} counters and ${b} ${c2} counters. Write the ratio of ${c2} to ${c1}.`, `${b}:${a}`);
    }
    if (r < .8) {      // the total and one part given: find the other part first
      const [x, y, where, all] = pick(RPAIRS); let T, a; do { T = ri(15, 35); a = ri(3, T - 3); } while (gcd(a, T) > 1);
      return Math.random() < .5 ? q(`${where} there are ${T} ${all}, all ${x} or ${y}. ${a} are ${x}. Write the ratio of ${x} to ${y}.`, `${a}:${T - a}`)
        : q(`${where} there are ${T} ${all}, all ${x} or ${y}. ${a} are ${x}. Write the ratio of ${y} to ${x}.`, `${T - a}:${a}`);
    }
    const fr = shuf([['apples', 'pears', 'plums'], ['pens', 'pencils', 'rulers'], ['red', 'green', 'yellow']].map(x => x)).pop(), isCol = fr[0] === 'red';
    let n; do { n = [ri(2, 12), ri(2, 12), ri(2, 12)]; } while (new Set(n).size < 3 || n.reduce(gcd) > 1);
    const o = shuf([0, 1, 2]), names = o.map(i => fr[i]);
    const what = isCol ? `${n[0]} red, ${n[1]} green and ${n[2]} yellow sweets` : `${n[0]} ${fr[0]}, ${n[1]} ${fr[1]} and ${n[2]} ${fr[2]}`;
    return q(`A bag has ${what}. Write the ratio of ${names.join(' to ')}.`, o.map(i => n[i]).join(':'));
  }, {pl: false});

sk('R2', 'RA', 'Equivalent ratios', 'Whatever you do to one part, do to the other. 3 : 5 = 12 : □. The 3 was multiplied by 4 to make 12, so 5 × 4 = 20.',
  () => {
    const [a, b] = rord(pick(COPRIME));
    if (Math.random() < .2) {      // the scale factor isn't a whole number: go through the simplest ratio
      const [m1, m2] = shuf([2, 3, 4, 5, 6]).slice(0, 2);
      return Math.random() < .5 ? q(`${a * m1} : ${b * m1} = ${a * m2} : □`, b * m2) : q(`${a * m1} : ${b * m1} = □ : ${b * m2}`, a * m2);
    }
    const m = ri(2, 9), big = [a * m, b * m], small = [a, b], hole = ri(0, 1), smallFirst = Math.random() < .6;
    const L = smallFirst ? small : big, R = (smallFirst ? big : small).slice(), ans = R[hole]; R[hole] = '□';
    return q(`${L[0]} : ${L[1]} = ${R[0]} : ${R[1]}`, ans);
  }, {pl: false, chain: () => { const [a, b] = rord(pick(COPRIME.filter(([x, y]) => y <= 5))); return [q(`${a} : ${b} = ${a * 4} : □`, b * 4), q(`${a} : ${b} = □ : ${b * 5}`, a * 5), q(`${a * 4} : ${b * 4} = ${a} : □`, b), q(`${a * 4} : ${b * 4} = ${a * 3} : □`, b * 3)]; }});

// R3 is above (step C).

const RUNITS = [['cm', 'm', 100, 5, 5], ['m', 'km', 1000, 50, 2], ['g', 'kg', 1000, 50, 5], ['p', '£', 100, 5, 5], ['minutes', 'hours', 60, 5, 5]];      // small, big, how many small in one big, step, most big units
const rbig = (u, v) => u === '£' ? rmoney(v) : u === 'hours' ? (v === 1 ? '1 hour' : v + ' hours') : nstr(v) + ' ' + u;
const rsmall = (u, v) => u === 'p' ? v + 'p' : v + ' ' + u;
sk('R4', 'RA', 'Simplifying: three parts, units and decimals', 'Three parts: divide all three by the same number. Different units: change them to the same unit first. 40 cm : 2 m is 40 cm : 200 cm = 1 : 5. Decimals: multiply every part by 10 until they are all whole. 1.5 : 2 is 15 : 20 = 3 : 4.',
  () => {
    const r = Math.random();
    if (r < 1 / 3) { const t = shuf(pick(RTRIPLES)), m = ri(2, 10); return q(`Simplify ${t.map(x => x * m).join(' : ')}`, t.join(':')); }
    if (r < 2 / 3) {
      const [s, B, U, st, mx] = pick(RUNITS); let a, b, k, big;
      do { [a, b] = pick(COPRIME); k = st * ri(1, Math.floor(U / st)); big = b * k / U; } while (a * k >= U || !(big >= .5 && big <= mx) || (U === 60 ? !Number.isInteger(big) : (b * k) % (U / 10) !== 0) || (B === '£' && !Number.isInteger(big * 2)));
      return Math.random() < .5 ? q(`Simplify ${rsmall(s, a * k)} : ${rbig(B, big)}`, `${a}:${b}`) : q(`Simplify ${rbig(B, big)} : ${rsmall(s, a * k)}`, `${b}:${a}`);
    }
    let a, b, j; do { [a, b] = rord(pick(COPRIME)); j = ri(1, 9); } while ((a * j) % 10 === 0 && (b * j) % 10 === 0);
    return q(`Simplify ${nstr(a * j / 10)} : ${nstr(b * j / 10)}`, `${a}:${b}`);
  }, {pl: false, chain: () => { let a, b, c; do { [a, b, c] = shuf(pick(RTRIPLES)); } while (gcd(a, b) > 1); const m = pick([4, 6]); return [q(`Simplify ${a * m} : ${b * m}`, `${a}:${b}`), q(`Simplify ${a * m} : ${b * m} : ${c * m}`, `${a}:${b}:${c}`), q(`Simplify ${nstr(a * m / 10)} : ${nstr(b * m / 10)}`, `${a}:${b}`), q(`Simplify ${a * m} cm : ${nstr(b * m / 10)} m`, rsimp(a * m, b * m * 10))]; }});

const RN_CTX = [['teachers', 'students', 'On a school trip'], ['sand', 'cement', 'In a mortar mix'], ['squash', 'water', 'In a drink']];
sk('R5', 'RA', 'The form 1 : n and n : 1', 'Divide both parts by the part that has to become 1. To write 4 : 10 in the form 1 : n, divide both by 4: 1 : 2.5.',
  () => {
    const d = pick([2, 4, 5, 8, 10, 20, 25]); let o; do { o = ri(1, Math.min(100, 4 * d)); } while (o === d || (o % d === 0 && Math.random() < .8) || (d >= 20 && o % 5 !== 0 && o % 4 !== 0));
    const n = nstr(o / d), first = Math.random() < .65;
    if (Math.random() < .3) { const [x, y, where] = pick(RN_CTX); return first ? q(`${where}, the ratio of ${x} to ${y} is ${d} : ${o}. Write this ratio in the form 1 : n.`, `1:${n}`, {form: 'one1'}) : q(`${where}, the ratio of ${x} to ${y} is ${o} : ${d}. Write this ratio in the form n : 1.`, `${n}:1`, {form: 'n1'}); }

  <div class="card"><label class="f"><span>Student</span><select id="shsrc"><option value="me" ${src === 'me' ? 'selected' : ''}>This device: ${esc(S.name)}</option>${Object.keys(S.cls).sort().map(n => `<option value="cls:${esc(n)}" ${src === 'cls:' + n ? 'selected' : ''}>Class list: ${esc(n)}${S.cls[n].light ? ' (fluency code)' : ''}</option>`).join('')}<option value="pick" ${src === 'pick' ? 'selected' : ''}>No student: choose a level by hand</option></select></label>

  <label class="f" style="flex:2;min-width:200px"><span>Level</span><select id="shk">${real(t).map(x => `<option value="${x.id}" ${x === k ? 'selected' : ''}>${lvNum(x)}. ${esc(x.name)}${src !== 'pick' && x === nu ? ' (next up)' : ''}</option>`).join('')}</select></label></div>
  <label class="f"><span>Sheet</span><select id="shtype"><option value="level" ${type === 'level' ? 'selected' : ''}>Level practice</option><option value="known" ${type === 'known' ? 'selected' : ''} ${k.idx ? '' : 'disabled'}>Mixed known</option><option value="bridge" ${type === 'bridge' ? 'selected' : ''} ${BRIDGES[k.id] ? '' : 'disabled'}>Bridge${BRIDGES[k.id] ? '' : ' (not for this level)'}</option></select></label>
  <p class="muted small">${help[type]}</p>
  <div class="row"><button class="btn pri" data-act="shmake">${V.sheet ? 'New questions' : 'Make the sheet'}</button>${V.sheet ? '<button class="btn" data-act="shprint">Print sheet and answers</button>' : ''}</div><div class="fb no">${esc(V.sherr || '')}</div></div>
  ${V.sheet ? `<p class="muted small">${V.sheet.n} questions on one side. The answers print on a second page.</p><div class="shprev">${V.sheet.page}</div>` : ''}`;
}

// ---------- events ----------
function copyEl(id) { const el = $('#' + id); if (!el) return; const t = el.value; (navigator.clipboard?.writeText(t) || Promise.reject()).catch(() => { el.style.display = ''; el.select(); try { document.execCommand('copy'); } catch (e) {} }); }
function backup() {
  const a_ = document.createElement('a'), url = URL.createObjectURL(new Blob([JSON.stringify(S)], {type: 'application/json'}));
  a_.href = url; a_.download = `maths-practice-${(S.name || 'student').replace(/[^\w-]+/g, '-')}-${today()}.json`; document.body.appendChild(a_); a_.click();
  setTimeout(() => { URL.revokeObjectURL(url); a_.remove(); }, 2000);
  S.lastBackup = today(); save(); V.berr = 'Backup downloaded. On an iPad it goes to the Files app, in Downloads.'; V.bok = true; render();
}
function restore(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let D; try { D = JSON.parse(rd.result); if (!D || typeof D !== 'object' || !D.skills || !D.days) throw 0; } catch (x) { V.berr = 'That file is not a Maths Practice backup.'; V.bok = false; return render(); }
    guard(`Replace everything on this device with the backup of ${D.name || 'this student'}? What is here now will be lost.`, () => { S = migrate(fromSaved(D)); syncMax(); V.berr = 'Backup restored.'; V.bok = true; });
  };
  rd.readAsText(file);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, k = el.dataset.id ? BY[el.dataset.id] : null;
  switch (a) {
    case 'up': case 'quit': backBtn(); break;
    case 'home': clearInterval(gTimer); clearInterval(spTimer); V = {view: 'home'}; save(); render(); break;
    case 'setname': { const n = $('#nm').value.trim(); if (n) { S.name = n; save(); V = {view: 'home'}; render(); } break; }
    case 'mode': S.mode = el.dataset.m; save(); render(); break;
    case 'place': placeIntro('fluency', FLUENCY_ORDER); break;
    case 'skillscheck': placeIntro('skills', skillsUnchecked()); break;
    case 'gcheck': { const g = GROUPS.find(x => x.id === el.dataset.g); placeIntro('skills', g.t.filter(t => !S.chk[t])); break; }
    case 'tcheck': startPlacement([el.dataset.st], 'area'); break;
    case 'placego': startPlacement(V.areas || FLUENCY_ORDER, V.mode || 'fluency'); break;
    case 'plcont': V.inter = null; nextProbe(); break;
    case 'trecheck': { const st = el.dataset.st; guard(`Recheck ${STR[st].name}? The student answers a short check now, and this area's level is set from it. Secure levels above the result go back into practice; the expected level stays as it is.`, () => startPlacement([st], 'single')); break; }
    case 'toolong': if (V.ask && $('#ans')) V.ask.val = $('#ans').value; guard('Stop the check here and start practising? Your teacher can move your levels later.', () => endPlacement(true), false); break;
    case 'skipplace': S.placed = true; save(); render(); break;
    case 'go': startSkill(k); window.scrollTo(0, 0); break;
    case 'quiz': startQuiz(k); window.scrollTo(0, 0); break;
    case 'fchome': clearInterval(fcTimer); V = {view: 'fc', back: V.view === 'fcdone' ? V.back : fromHere()}; render(); window.scrollTo(0, 0); break;
    case 'fcdeck': V = {view: 'fcdeck', d: el.dataset.d, back: V.view === 'fc' ? {view: 'fc', back: V.back} : fromHere()}; render(); window.scrollTo(0, 0); break;
    case 'fcstudy': fcStudy(V.d); break;
    case 'fcknow': V.hid.push(el.dataset.k); V.st0 = Date.now(); V.warn = false; render(); break;
    case 'fchard': { const r = toPile(el.dataset.k, 'me'); r.h = true; r.st = 0; V.hid.push(el.dataset.k); V.st0 = Date.now(); V.warn = false; save(); render(); break; }
    case 'fcstart': fcStart(V.d); break;
    case 'fcnext': if (V.view === 'fcs') fcNext(); break;
    case 'fckey': fcKey(el.dataset.k); break;
    case 'fcprint': fcPrint(); break;
    case 'fctdeck': V.fcT = el.dataset.d; V.fcSel = []; render(); break;
    case 'fcrow': case 'fccol': { const G = fcGridSpec(V.fcT || 'M'), v = +el.dataset[a === 'fcrow' ? 'r' : 'c'], ks = (a === 'fcrow' ? G.cols.map(c => G.key(v, c)) : G.rows.map(r => G.key(r, v))).filter(x => FCF[x]); V.fcSel = V.fcSel || []; const all = ks.every(x => V.fcSel.includes(x)); V.fcSel = all ? V.fcSel.filter(x => !ks.includes(x)) : [...new Set([...V.fcSel, ...ks])]; render(); break; }
    case 'fcsall': V.fcSel = FCL[V.fcT || 'M'].map(f => f.k); render(); break;
    case 'fcsnk': V.fcSel = FCL[V.fcT || 'M'].filter(f => !['known', 'got'].includes(fcCellCls(f.k))).map(f => f.k); render(); break;
    case 'fcsnone': V.fcSel = []; render(); break;
    case 'fcpadd': (V.fcSel || []).forEach(x => { const r = toPile(x, 'teacher'); r.src = 'teacher'; }); V.fcSel = []; save(); render(); break;
    case 'fcpgot': (V.fcSel || []).forEach(x => { S.fc[x] = Object.assign(S.fc[x] || {}, {s: 'got', st: 3, h: false}); }); V.fcSel = []; save(); render(); break;
    case 'fcpoff': (V.fcSel || []).forEach(x => { delete S.fc[x]; }); V.fcSel = []; save(); render(); break;
    case 'qgo': runQuiz(); break;
    case 'ladder': V = {view: 'ladder', st: el.dataset.st, back: V.view === 'group' ? {view: 'group', g: V.g} : null}; render(); window.scrollTo(0, 0); break;
    case 'group': V = {view: 'group', g: el.dataset.g}; render(); window.scrollTo(0, 0); break;
    case 'linked': startLinked(k); window.scrollTo(0, 0); break;
    case 'speed': startSpeed(k, +el.dataset.n); window.scrollTo(0, 0); break;
    case 'sgo': speedGo(); break;
    case 'skey': speedKey(el.dataset.k); break;
    case 'me': V = {view: 'me'}; render(); break;
    case 'prog': V = {view: 'teacher', tab: 'over'}; render(); break;
    case 'myes': { const m = V.modal; if (m.pin && $('#mpin').value !== S.pin) { m.err = 'That PIN is not right.'; return render(); } if (m.pin) V.unlocked = true; V.modal = null; m.fn(); save(); render(); break; }
    case 'mno': V.modal = null; render(); break;
    case 'unit': V.ask.val = $('#ans').value; V.ask.unit = el.dataset.u; render(); break;
    case 'typed': startTyped(); break;
    case 'key': padKey(el.dataset.k); break;
    case 'focusans': $('#ans')?.focus(); break;
    case 'submit': submitAns($('#ans') ? $('#ans').value : V.ask.val); break;
    case 'wpick': whyPick(+el.dataset.i); break;
    case 'whygo': whyGo(); break;
    case 'choice': submitAns(V.ask.q.opts[+el.dataset.i]); break;
    case 'skip': skipAns(); break;
    case 'next': if (!needsCheck(V.ask)) nextAsk(); break;
    case 'wchk': if (V.ask) { V.ask.wok = el.checked; render(); } break;
    case 'tomark': V.bsec = V.bt0 ? Math.round((Date.now() - V.bt0) / 1000) : undefined; V.phase = 'mark'; render(); window.scrollTo(0, 0); break;
    case 'mark': V.marks[+el.dataset.i] = el.dataset.v === '1'; render(); break;
    case 'marked': V.phase = 'rate'; render(); window.scrollTo(0, 0); break;
    case 'rate': finishRound(el.dataset.r); window.scrollTo(0, 0); break;
    case 'game': startGame(); break;
    case 'race': raceMenu(false); break;
    case 'rtry': raceMenu(true); break;
    case 'rfriend': V.r.friend = el.dataset.f === '1'; render(); break;
    case 'rlist': V.r = racePick(); render(); window.scrollTo(0, 0); break;
    case 'rgo': raceStart(+el.dataset.i, +el.dataset.n || 0); window.scrollTo(0, 0); break;
    case 'rkey': raceKey(el.dataset.k); break;
    case 'gt': gTap(+el.dataset.i); break;
    case 'gop': if (V.g.sel !== null) { V.g.op = V.g.op === el.dataset.o ? null : el.dataset.o; render(); } break;
    case 'gundo': if (V.g.hist.length) { V.g.t = V.g.hist.pop(); V.g.sel = null; V.g.op = null; V.g.msg = ''; render(); } break;
    case 'greset': V.g.t = V.g.orig.slice(); V.g.hist = []; V.g.sel = null; V.g.op = null; V.g.msg = ''; render(); break;
    case 'gskip': gNew(); render(); break;
    case 'ttab': { const t = el.dataset.t; V.err = ''; if (['class', 'tools', 'sheets', 'cards'].includes(t) && !V.unlocked) guard('Teacher tools', () => { V.tab = t; }); else { V.tab = t; render(); } break; }
    case 'celebrate': guard('Mark all trophies so far as celebrated?', () => { S.celebrated = today(); }); break;
    case 'setexp': guard('Set the expected levels to where ' + S.name + ' is working now?', () => { for (const st in L) S.exp[st] = idAt(st, Math.min(pos(st), L[st].length - 1)); }); break;
    case 'tstart': guard(`Are you sure? This moves ${S.name} to start at "${k.name}".`, () => { setStart(k.st, k.idx); L[k.st].slice(0, k.idx).forEach(x => { const s = S.skills[x.id]; if (s) s.support = false; }); S.chk[k.st] = S.chk[k.st] || 'set by teacher'; syncMax(); }); break;
    case 'tsec': guard(`Are you sure? This marks "${k.name}" as secure.`, () => { const s = ss(k.id); s.st = 'secure'; s.support = false; s.fails = 0; s.wob = 0; s.fast = false; syncMax(); }); break;
    case 'tsup': guard(`Are you sure? This puts "${k.name}" back into practice.`, () => { const s = ss(k.id); s.support = true; s.st = 'new'; s.as = false; s.passes = []; s.fast = false; }); break;
    case 'texp': guard(`Set the expected level to "${k.name}"?`, () => { S.exp[k.st] = k.id; }); break;
    case 'copy': copyEl(el.dataset.el); el.textContent = 'Copied'; break;
    case 'cadd': try { const P = dec($('#cin').value); if (!P.n) throw 0; S.cls[P.n] = P; V.err = ''; V.cv = P.n; save(); } catch (x) { V.err = 'That does not look like a progress code.'; } render(); break;
    case 'fcadd': {
      const n = $('#fcn').value.trim(), fp = readFluencyCode($('#fcc').value);
      if (!n || !fp) { V.err = !n ? "Type the student's name as well." : 'That does not look like a fluency code. It looks like A5 S4 X3 M6 D2.'; return render(); }
      const P = S.cls[n] || {v: 2, n, light: true, days: {}, tr: [], fl: [], ex: {}, pos: {}};
      Object.assign(P.pos, fp); P.d = today(); P.fc = FC_ORDER.filter(t => P.pos[t]).map(t => P.pos[t] === '#end' ? t + '*' : P.pos[t]).join(' ');
      S.cls[n] = P; V.err = ''; V.cv = n; save(); render(); break;
    }
    case 'cview': V.cv = el.dataset.n; render(); break;
    case 'csheet': Object.assign(V, {tab: 'sheets', shSrc: 'cls:' + el.dataset.n, shT: null, shK: null, sheet: null, sherr: ''}); render(); window.scrollTo(0, 0); break;
    case 'cdel': { const n = el.dataset.n; guard('Remove ' + n + ' from the class list?', () => { delete S.cls[n]; }); break; }
    case 'cprint': $('#print').innerHTML = `<div class="pg"><h2>Maths practice report: ${esc(V.cv)}</h2>${overviewHTML(S.cls[V.cv])}</div>`; setTimeout(() => window.print(), 60); break;
    case 'shmake': { const {k: sk_, type} = sheetLevel(), sh = makeSheet(sk_, type, sheetSrc().who); V.sheet = sh; V.sherr = sh ? '' : 'There are no earlier levels in this area to mix. Choose Level practice.'; render(); break; }
    case 'shprint': if (V.sheet) { $('#print').innerHTML = V.sheet.page + V.sheet.ans; setTimeout(() => window.print(), 60); } break;
    case 'backup': backup(); break;
    case 'padd': try { const arr = JSON.parse($('#pin_').value.replace(/^[^\[]*/, '').replace(/[^\]]*$/, '')); const good = arr.filter(p => p && p.id && p.q && typeof p.a === 'number' && p.level >= 1 && p.level <= 6 && !packs().some(x => x.id === p.id)); if (!good.length) throw 0; S.packs.push(...good); V.err = `Added ${good.length} problem${good.length > 1 ? 's' : ''}.`; V.pok = true; save(); } catch (x) { V.err = 'Could not read that. It needs to be the JSON list from the prompt.'; V.pok = false; } render(); break;
    case 'pclear': guard('Remove the extra problems saved on this device?', () => { S.packs = []; }); break;
    case 'ssave': S.name = $('#sname').value.trim() || S.name; S.pin = $('#spin').value.trim() || S.pin; S.set.games = $('#sg').checked; S.set.race = $('#sr').checked; S.set.links = $('#sl').checked; save(); render(); break;
    case 'wipe': guard('Erase all progress for ' + S.name + ' on this device? This cannot be undone.', () => { const cls = S.cls, pin = S.pin; S = fresh(); S.cls = cls; S.pin = pin; S.known = SK.map(x => x.id); syncMax(); V = {view: 'home'}; }); break;
  }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'plv') { V.plv = +v; render(); }
  else if (id === 'shsrc') { Object.assign(V, {shSrc: v, shT: null, shK: null, sheet: null, sherr: ''}); render(); }
  else if (id === 'sht') { Object.assign(V, {shT: v, shK: null, sheet: null, sherr: ''}); render(); }
  else if (id === 'shk') { Object.assign(V, {shK: v, sheet: null, sherr: ''}); render(); }
  else if (id === 'shtype') { Object.assign(V, {shType: v, sheet: null, sherr: ''}); render(); }
  else if (id === 'rfile' && e.target.files[0]) restore(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (V.view === 'fcs' && !V.modal) { if (/^\d$/.test(e.key)) fcKey(e.key); else if (e.key === 'Backspace') fcKey('⌫'); else if (e.key === 'Enter') $('[data-act=fcnext]')?.click(); return; }
  if (V.view === 'race' && !V.modal && V.r.ph === 'run') { if (/^\d$/.test(e.key)) raceKey(e.key); else if (e.key === 'Backspace') raceKey('⌫'); return; }
  if (V.view === 'speed' && !V.modal) { if (!V.t0) { if (e.key === 'Enter') speedGo(); } else if (/^\d$/.test(e.key)) speedKey(e.key); else if (e.key === 'Backspace') speedKey('⌫'); return; }
  if (e.key !== 'Enter') return;
  if (V.modal) { e.preventDefault(); return $('[data-act=myes]')?.click(); }
  if (V.ask?.state === 'open' && $('#ans')) { e.preventDefault(); submitAns($('#ans').value); }
  else if (V.ask?.state === 'why') { e.preventDefault(); whyGo(); }
  else if (V.ask && V.ask.state !== 'open') { e.preventDefault(); if (!needsCheck(V.ask)) nextAsk(); }
  else if (V.view === 'welcome') $('[data-act=setname]')?.click();
});
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
render();
</script>
