<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Maths Practice</title>
<style>
:root{--bg:#f4f2ec;--panel:#fff;--ink:#1c2230;--muted:#646c7a;--line:#dedad0;--accent:#274c77;--accent-ink:#fff;
--k:#3d7a5a;--n:#2f6f8f;--f:#8a5a9e;--w:#b4682a;--ok:#2f8a53;--warn:#b97a14;--bad:#c2482f;--soft:#eef2f7;--gold:#c99a1d;
--font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181e;--panel:#1f242d;--ink:#eceef2;--muted:#9aa3b2;--line:#343b48;--accent:#7fb0e6;--accent-ink:#0f1620;--soft:#262d39;--k:#7cc79c;--n:#6bb3d6;--f:#c29ad6;--w:#e3a063;--ok:#5cc487;--warn:#e6b455;--bad:#ef8a73}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
main{max-width:760px;margin:0 auto;padding:14px 16px 70px}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:19px;margin:18px 0 8px}h3{font-size:16px;margin:12px 0 4px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{font-size:19px;padding:13px 22px}.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.45}.btn.danger{color:var(--bad)}
.homelink{display:inline-block;margin:4px 0 2px;color:var(--muted);font-size:14px;text-decoration:none}.homelink:hover{text-decoration:underline}
.top{display:flex;align-items:center;gap:10px;margin:0 -16px 4px;padding:8px 16px;position:sticky;top:0;z-index:10;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--ink);color:var(--bg)}
.strand{border-left:6px solid var(--c)}
.strand .lvl{color:var(--c);font-weight:700}
.pbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--c,var(--accent))}
.eg{display:inline-block;background:var(--soft);border-radius:8px;padding:1px 8px;margin-left:4px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:600;background:var(--soft)}
.chip.secure{background:var(--ok);color:#fff}.chip.learning{background:var(--warn);color:#fff}.chip.support{background:var(--bad);color:#fff}.chip.assumed,.chip.mixed{background:var(--soft);color:var(--muted)}

.steps{display:flex;gap:6px;margin:6px 0 12px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}
.qbig{font-size:38px;font-weight:700;text-align:center;margin:18px 0 10px;line-height:1.3}
.qbig.wp{font-size:21px;font-weight:500;text-align:left;line-height:1.5}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.15;margin:0 .18em}
.fr span:first-child{border-bottom:.09em solid currentColor;padding:0 .25em}.fr span:last-child{padding:0 .25em}
.box{display:inline-block;width:1.3em;height:1.15em;border:.08em solid currentColor;border-radius:.2em;vertical-align:middle;opacity:.65}
.fr .box{width:1.1em;height:.95em;margin:.1em 0}
#ans{position:absolute;opacity:0;width:1px;height:1px;border:0;padding:0;pointer-events:none}
.ansbox{display:flex;align-items:center;justify-content:center;gap:4px;min-height:64px;font-size:30px;padding:6px 10px;border:2px solid var(--accent);border-radius:12px;background:var(--panel);cursor:text}
.ansbox .pre{color:var(--muted)}
.ansbox .fr{font-size:.8em}.ansbox .fr span{min-width:1.1em;display:block}
.caret{display:inline-block;width:2px;height:.95em;background:currentColor;vertical-align:middle;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ic{display:inline-flex;align-items:center;gap:3px;font-size:16px;vertical-align:middle}.ic .fr{font-size:15px}.ic .fr span{border-color:currentColor}.ic .sq{display:inline-block;width:11px;height:11px;border:1.5px solid currentColor;border-radius:2px}
p .ic{font-size:12px}p .ic .fr{font-size:11px}p .ic .sq{width:8px;height:8px}
.pad .wide{grid-column:span 4}
.tline{display:flex;gap:10px;align-items:center;margin:6px 0}.tline .chip{white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto}
.pad button{font-size:22px;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:50px}
.pad button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.fb{min-height:30px;text-align:center;font-weight:600;margin:8px 0}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}.fb.warn{color:var(--warn)}
.sol{background:var(--soft);border-radius:10px;padding:10px 14px;margin:10px 0}
.blist{list-style:none;padding:0;margin:8px 0}
.blist li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:22px}
.blist .n{color:var(--muted);font-size:15px;min-width:26px}
.blist .a{margin-left:auto;font-weight:700;color:var(--accent)}
.mk{display:flex;gap:6px}.mk button{width:46px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-size:20px;cursor:pointer}
.mk button.y.on{background:var(--ok);border-color:var(--ok);color:#fff}.mk button.x.on{background:var(--bad);border-color:var(--bad);color:#fff}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rate button{padding:16px 6px;font-size:17px}
.tro{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.tro .ic{font-size:26px}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:15px;vertical-align:top}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:10px 0}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
label.f{display:block;margin:8px 0}label.f span{display:block;font-size:14px;color:var(--muted)}
input[type=text],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.tiles button{width:72px;height:72px;font-size:28px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.tiles button.on{border-color:var(--accent);background:var(--soft)}
.ops button{width:60px;height:54px;font-size:26px}
.target{font-size:54px;font-weight:800;text-align:center;color:var(--accent)}
.flag{padding:5px 0;border-bottom:1px solid var(--line)}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .card{max-width:420px;width:100%}
#print{display:none}
.sheet{width:186mm;color:#000;background:#fff;font-size:15px;line-height:1.35}
.sheet h2{font-size:20px;margin:0}.sheet .sub{font-size:12px;color:#444}
.sheet .shd{display:flex;gap:5mm;align-items:flex-end;font-size:14px;border-bottom:1.5px solid #000;padding-bottom:2mm}
.sheet .ln{display:inline-block;min-width:38mm;border-bottom:1px solid #000;font-weight:700;padding:0 1mm}.sheet .ln.sm{min-width:22mm}
.sheet .shd2{display:flex;gap:5mm;align-items:center;font-size:14px;margin:2.5mm 0 1mm}.sheet .shd2>span:first-child{white-space:nowrap;flex:none}.sheet .stip{font-size:12.5px;color:#333;font-style:italic}
.sheet .bx{display:inline-block;border:1.5px solid #000;width:24mm;height:8mm;vertical-align:middle;margin-left:1.5mm;border-radius:1mm}.sheet .bx.sm{width:14mm}
.sheet .sec{font-weight:700;font-size:13.5px;margin:3mm 0 0}
.sheet .sq{display:grid;column-gap:6mm}
.sheet .sq>div{display:flex;gap:2.5mm;align-items:baseline;padding:2.6mm 0;border-bottom:1px dotted #999;font-size:18px}
.sheet .sq b{font-size:11px;color:#555;min-width:6mm;font-weight:600}
.sheet .sq.tall>div{min-height:36mm;align-items:flex-start}
.sheet .sq>.pair{gap:3mm;align-items:center;font-size:16px}.sheet .pair>div{display:flex;gap:1.5mm;align-items:baseline;flex:1;white-space:nowrap}
.sheet .pair>.known{border:1.5px dashed #666;border-radius:2mm;padding:1mm 2mm}
.sheet .sft{margin-top:4mm;border-top:1.5px solid #000;padding-top:2mm;font-size:13px}.sheet .sft>div:first-child{display:flex;gap:8mm;align-items:center;margin-bottom:1.5mm}
.sheet .ans{display:flex;flex-wrap:wrap;gap:1.5mm 7mm;font-size:13px;margin-top:3mm}
.shprev{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;padding:3mm;margin:8px 0}
@media print{@page{size:A4;margin:12mm}body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff}
#print .pg{page-break-after:always}#print .pg:last-child{page-break-after:auto}
#print .pq{display:grid;grid-template-columns:1fr 1fr;gap:14px 30px;font-size:19px;margin-top:14px}#print .pq div{padding-bottom:16px;border-bottom:1px dotted #999}
#print .pa{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px}}
</style>
</head>
<body>
<main id="app"></main>
<div id="print"></div>
<!-- Optional extra word problems. If packs.js sits next to this file it is loaded; if not, nothing breaks. -->
<script src="packs.js" onerror="void 0"></script>
<script>
'use strict';
/* ============================================================================
   MATHS PRACTICE  ·  one file, no server. Progress is saved in this browser.
   The cog opens the progress screen. Changing levels and the teacher tools
   need the teacher PIN (default 6767; change it in Tools).
   ============================================================================ */
const CONFIG = {
  pin: '6767',          // default teacher PIN for a fresh device
  typedN: 5,            // typed quick-check questions per round
  bookN: 8,             // written (in the book) questions per round
  passAcc: 0.8,         // round counts as a pass at this accuracy (and not rated "tough")
  gameSecs: 180,        // length of the reward game
  autoSecs: 3,          // whole-number fluency: an answer counts as automatic within this many seconds (small numbers; see autoLimit)
  autoShare: 0.8,       // share of typed fluency answers that must be automatic for a round to count towards securing the level
  checkLongSecs: 120,   // after this long, the Fluency challenge offers "These questions take me too long"
  checkCap: {fluency: 16, skill: 6},   // most questions the level check asks in one area
  divAfter: 'M6',       // division joins the Fluency challenge only if multiplication reached this level (the tougher tables)
  quizN: 10,            // questions in the quick quiz after a worksheet
  quizPass: 0.9,        // the quick quiz secures a level at this accuracy (and, for fluency, autoShare automatic)
  links: [              // "stretch" links shown to students working at the top levels
    ['Transum games and puzzles', 'https://www.transum.org/Software/Game/'],
    ['Beast Academy: All Ten', 'https://beastacademy.com/all-ten'],
    ['NRICH problems', 'https://nrich.maths.org/'],
    ['Corbettmaths 5-a-day', 'https://corbettmaths.com/5-a-day/'],
  ],
};

// ---------- helpers ----------
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuf = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const nstr = x => String(parseFloat(Number(x).toFixed(6)));
const F = (n, d) => `{${n}/${d}}`;
const fs = (n, d) => { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : `${n}/${d}`; };
const pad2 = n => String(n).padStart(2, '0');
const dstr = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const today = () => dstr();
const dOff = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const nice = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'}); };
const fmt = s => esc(s).replace(/\{(?:(-?\d+) )?([^{}\/ ]+)\/([^{}\/ ]+)\}/g, (_, w, n, d) => `${w || ''}<span class="fr"><span>${n}</span><span>${d}</span></span>`).replace(/\^□/g, '<sup><span class="box"></span></sup>').replace(/□/g, '<span class="box"></span>').replace(/\n/g, '<br>');
const q = (t, a, o = {}) => ({q: t, a, ...o});
const SUPS = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => (n < 0 ? '⁻' : '') + String(Math.abs(n)).split('').map(d => SUPS[d]).join('');
const mmss = x => { x = Math.round(x); return Math.floor(x / 60) + ':' + pad2(x % 60); };

// ---------- answers ----------
function parseVal(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/[£%,°]/g, '').replace(/\s*[a-zA-Z]+$/, '').trim(); let m;
  if ((m = s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/))) { const w = +m[2], n = +m[3], d = +m[4]; if (!d) return null; return {n: (m[1] ? -1 : 1) * (w * d + n), d, form: 'mixed', low: gcd(n, d) === 1 && n < d}; }
  if ((m = s.match(/^(-?\d+)\s*\/\s*(\d+)$/))) { const n = +m[1], d = +m[2]; if (!d) return null; return {n, d, form: 'frac', low: gcd(n, d) === 1}; }
  if ((m = s.match(/^(-?)(\d*)\.(\d+)$/))) { const d = 10 ** m[3].length, n = (+(m[2] || 0)) * d + +m[3]; return {n: (m[1] ? -1 : 1) * n, d, form: 'dec'}; }
  if (/^-?\d+$/.test(s)) return {n: +s, d: 1, form: 'int'};
  return null;
}
function check(Q, inp) {
  const v = parseVal(inp); if (!v) return {bad: true};
  const t = parseVal(typeof Q.a === 'number' ? nstr(Q.a) : Q.a);
  if (v.n * t.d !== t.n * v.d) return {ok: false};
  if (Q.form) {
    if (v.form === 'dec') return {retry: 'Right value. Write it as a fraction.'};
    if (Q.form === 'simplest' && v.form !== 'int' && !v.low) return {retry: 'Right value. Now simplify it.'};
    if (Q.form === 'mixed' && v.form !== 'mixed') return {retry: 'Right value. Write it as a mixed number.'};
    if (Q.form === 'improper' && v.form !== 'frac') return {retry: 'Right value. Write it as an improper fraction.'};
  }
  return {ok: true};
}
function ansHTML(Q) {
  let s;
  if (Q.kind === 'choice') s = fmt(Q.a);
  else if (typeof Q.a === 'number') s = (Q.pre === '£' && !Number.isInteger(Q.a) ? Q.a.toFixed(2) : nstr(Q.a)).replace('-', '−');
  else s = fmt(Q.a.includes('/') ? `{${Q.a}}` : Q.a);
  return esc(Q.pre || '') + s + esc(Q.suf || '');
}

// ---------- skills ----------
const SK = [];
const sk = (id, st, name, tip, gen, extra = {}) => SK.push({id, st, name, tip, gen, ...extra});
const tab = list => () => { const n = pick(list), k = ri(2, 12); return pick([q(`${n} × ${k}`, n * k), q(`${k} × ${n}`, n * k), q(`${n * k} ÷ ${n}`, k)]); };
const ds = (m, p) => p <= 0 ? String(m * 10 ** (-p)) : (m / 10 ** p).toFixed(p);
const no5 = n => +Array.from({length: n}, () => pick([1, 2, 3, 4, 6, 7, 8, 9])).join('');

/* ---- Number facts, in the order of Dylan Kane's Incremental Fact Fluency ----
   Each level is one fact family. Typed and book questions mix the new family with earlier families of the same operation.
   x12 and the mixed-tables level are additions for the English 12 x 12 expectation. */
const fam = (id, name, tip, gen) => sk(id, 'K', name, tip, gen, {op: id[0]});
const com = (a, b, op = '+') => Math.random() < .5 ? `${a} ${op} ${b}` : `${b} ${op} ${a}`;
const addF = (ns, lo = 1) => () => { const n = pick(ns), a = ri(lo, 10); return q(com(a, n), a + n); };
const subF = (ns, hi) => () => { const n = pick(ns), x = ri(n + 1, hi); return q(`${x} − ${n}`, x - n); };
const difF = (ns, hi) => () => { const n = pick(ns), x = ri(n + 2, hi); return q(`${x} − ${x - n}`, n); };
fam('A1', 'Addition: +1', 'Adding 1 gives the next number when you count.', addF([1]));
fam('A2', 'Addition: +2', 'Count on two. Even stays even, odd stays odd.', addF([2]));
fam('A3', 'Addition: +0', 'Adding zero changes nothing.', addF([0], 0));
fam('A4', 'Addition: doubles', 'Doubles are worth knowing by heart. They unlock lots of other facts.', () => { const a = ri(1, 10); return q(`${a} + ${a}`, 2 * a); });
fam('A5', 'Addition: near doubles', 'Double the smaller number, then add 1. For 7 + 8: double 7 is 14, and one more is 15.', () => { const a = ri(1, 9); return q(com(a, a + 1), 2 * a + 1); });
fam('A6', 'Addition: +3 and +4', 'Count on, or split it: +4 is +2 and +2.', addF([3, 4]));
fam('A7', 'Addition: +5, +6 and +7', 'Go through 10. For 8 + 6: 8 + 2 makes 10, then 4 more is 14.', addF([5, 6, 7], 3));
fam('S1', 'Subtraction: −1 and −2', 'Count back one or two.', subF([1, 2], 12));
fam('S2', 'Subtraction: difference of 1 or 2', 'The numbers are close together, so count up from the smaller one. 9 − 7: from 7 up to 9 is 2.', difF([1, 2], 12));
fam('S3', 'Subtraction: taking all or nothing', 'A number take away itself is 0. A number take away 0 stays the same.', () => { const x = ri(1, 12); return pick([q(`${x} − ${x}`, 0), q(`${x} − 0`, x)]); });
fam('S4', 'Subtraction: −3 and −4', 'Count back, or think addition: 11 − 4 asks "4 and what makes 11?"', subF([3, 4], 13));
fam('S5', 'Subtraction: difference of 3 or 4', 'Count up from the smaller number to the bigger one.', difF([3, 4], 13));
fam('S6', 'Subtraction: −9', 'Take away 10, then add 1 back. 16 − 9: 16 − 10 is 6, add 1 is 7.', subF([9], 18));
fam('S7', 'Subtraction: −5 and −6', 'Think addition: 13 − 6 asks "6 and what makes 13?"', subF([5, 6], 15));
fam('S8', 'Subtraction: −7 and −8', 'Go back through 10. 15 − 7: take 5 to reach 10, then 2 more is 8.', subF([7, 8], 17));
const MT = {2: 'Double it.', 10: 'The digits move one place to the left: 7 becomes 70.', 5: 'Half of ten times. 5 × 8 is half of 80.', 4: 'Double, then double again.', 3: 'Double it, then add one more lot.', 11: 'Up to 9, the digit repeats: 11 × 7 = 77. Then 11 × 10 = 110.', 9: 'Ten lots, take away one lot. 9 × 7 is 70 − 7.', 6: 'Five lots, plus one more lot. 6 × 7 is 35 + 7.', 8: 'Double, double, double.', 7: 'Five lots plus two lots. 7 × 8 is 40 + 16.', 12: 'Ten lots plus two lots. 12 × 7 is 70 + 14.'};
[2, 10, 5, 0, 4, 3, 11, 9, 6, 8, 7, 12].forEach(n => n === 0
  ? fam('M01', 'Multiplication: ×0 and ×1', 'Times 1 stays the same. Times 0 is always 0.', () => { const n1 = pick([0, 1]), k = ri(1, 10); return q(com(n1, k, '×'), n1 * k); })
  : fam('M' + n, 'Multiplication: ×' + n, MT[n], () => { const k = ri(2, n === 12 ? 12 : 10); return q(com(n, k, '×'), n * k); }));
[2, 10, 5, 0, 4, 3, 11, 9, 6, 8, 7, 12].forEach(n => n === 0
  ? fam('D01', 'Division: ÷1 and by itself', 'Dividing by 1 changes nothing. A number divided by itself is 1. Zero shared out is still 0.', () => { const k = ri(2, 12); return pick([q(`${k} ÷ 1`, k), q(`${k} ÷ ${k}`, 1), q(`0 ÷ ${k}`, 0)]); })
  : fam('D' + n, 'Division: ÷' + n, `Ask the multiplication question: ${n * 7} ÷ ${n} is "${n} times what makes ${n * 7}?"`, () => { const k = ri(2, n === 12 ? 12 : 10); return q(`${n * k} ÷ ${n}`, k); }));

/* ---- Strand N: number skills ---- */

sk('F15', 'F', 'Adding and subtracting decimals', 'Line up the decimal points. Fill gaps with zeros: 5 − 1.36 is 5.00 − 1.36.', () => { const A = ri(11, 99) * 10, B = ri(101, 899); if (B % 10 === 0) return q(`${nstr(A / 100)} + ${nstr((B + 3) / 100)}`, (A + B + 3) / 100); const n = ri(Math.ceil(B / 100) + 1, 12); return pick([q(`${nstr(A / 100)} + ${nstr(B / 100)}`, (A + B) / 100), q(`${nstr(Math.max(A, B) / 100)} − ${nstr(Math.min(A, B) / 100)}`, Math.abs(A - B) / 100), q(`${n} − ${nstr(B / 100)}`, (n * 100 - B) / 100)]); });
sk('F16', 'F', 'Multiplying and dividing decimals', 'Do it with whole numbers first, then put the decimal places back. 0.3 × 0.4: 3 × 4 = 12, two decimal places, so 0.12.', () => { const a = ri(2, 9), b = ri(2, 9); return pick([q(`0.${a} × ${b}`, a * b / 10), q(`0.${a} × 0.${b}`, a * b / 100), q(`0.0${a} × ${b}`, a * b / 100), q(`${nstr(a * b / 10)} ÷ ${b}`, a / 10), q(`1.${a} × ${b}`, (10 + a) * b / 10)]); });

// ---------- level checks ----------
/* Two kinds of check (14 Nov 2026):
   - The Fluency challenge: timed whole-number fluency only. Multiplication (from ×2), then subtraction and addition (from teen facts),
     then Extending facts (bonds, through a ten ...), then division, which joins only if multiplication reached CONFIG.divAfter.
   - Skills checks: one per group (Number skills; Fractions, decimals, percentages), offered later from the home screen.
   Both are adaptive: two questions per fluency level (both correct, and automatic when the clock shows), one per skill level.
   A good result moves up 2 levels (3 if very quick); 10 good answers in a row jumps half-way up. A missed fluency level drops
   down a little and is rechecked: it counts as "not yet" only after two misses. In skills, one miss counts.

function plStart(st, list) {

}

function startPlacement(areas, mode = 'fluency') {

}

  if (V.single || V.mode === 'area') V.inter = {t: (V.single ? 'Recheck: ' : 'Find your level: ') + STR[st].name, b: fx ? `<span class="chip">⏱ Timed</span> Goal: each answer straight away, in under ${CONFIG.autoSecs} seconds for small numbers, without counting.` : `<span class="chip">No time goal</span> Take your time, and use your book for working if you need it.`};
  else if (st === 'D' && V.mode === 'fluency') V.inter = {t: 'Now division', b: 'Your multiplication went well, so here are some division facts. <span class="chip">⏱ Timed</span> Think of the multiplication: 56 ÷ 7 asks "7 times what makes 56?"'};

  else if (p.pends.length) { const pm = Math.min(...p.pends); c = pm === p.lo + 1 ? pm : Math.max(p.lo + 1, pm - 2); }      // drop down a little, then recheck

    case 'cadd': try { const P = dec($('#cin').value); if (!P.n) throw 0; S.cls[P.n] = P; V.err = ''; V.cv = P.n; save(); } catch (x) { V.err = 'That does not look like a progress code.'; } render(); break;
    case 'fcadd': {
      const n = $('#fcn').value.trim(), fp = readFluencyCode($('#fcc').value);
      if (!n || !fp) { V.err = !n ? "Type the student's name as well." : 'That does not look like a fluency code. It looks like A5 S4 X3 M6 D2.'; return render(); }
      const P = S.cls[n] || {v: 2, n, light: true, days: {}, tr: [], fl: [], ex: {}, pos: {}};
      Object.assign(P.pos, fp); P.d = today(); P.fc = FC_ORDER.filter(t => P.pos[t]).map(t => P.pos[t] === '#end' ? t + '*' : P.pos[t]).join(' ');
      S.cls[n] = P; V.err = ''; V.cv = n; save(); render(); break;
    }
    case 'cview': V.cv = el.dataset.n; render(); break;
    case 'csheet': Object.assign(V, {tab: 'sheets', shSrc: 'cls:' + el.dataset.n, shT: null, shK: null, sheet: null, sherr: ''}); render(); window.scrollTo(0, 0); break;
    case 'cdel': { const n = el.dataset.n; guard('Remove ' + n + ' from the class list?', () => { delete S.cls[n]; }); break; }
    case 'cprint': $('#print').innerHTML = `<div class="pg"><h2>Maths practice report: ${esc(V.cv)}</h2>${overviewHTML(S.cls[V.cv])}</div>`; setTimeout(() => window.print(), 60); break;
    case 'shmake': { const {k: sk_, type} = sheetLevel(), sh = makeSheet(sk_, type, sheetSrc().who); V.sheet = sh; V.sherr = sh ? '' : 'There are no earlier levels in this area to mix. Choose Level practice.'; render(); break; }
    case 'shprint': if (V.sheet) { $('#print').innerHTML = V.sheet.page + V.sheet.ans; setTimeout(() => window.print(), 60); } break;
    case 'backup': backup(); break;
    case 'padd': try { const arr = JSON.parse($('#pin_').value.replace(/^[^\[]*/, '').replace(/[^\]]*$/, '')); const good = arr.filter(p => p && p.id && p.q && typeof p.a === 'number' && p.level >= 1 && p.level <= 6 && !packs().some(x => x.id === p.id)); if (!good.length) throw 0; S.packs.push(...good); V.err = `Added ${good.length} problem${good.length > 1 ? 's' : ''}.`; V.pok = true; save(); } catch (x) { V.err = 'Could not read that. It needs to be the JSON list from the prompt.'; V.pok = false; } render(); break;
    case 'pclear': guard('Remove the extra problems saved on this device?', () => { S.packs = []; }); break;
    case 'ssave': S.name = $('#sname').value.trim() || S.name; S.pin = $('#spin').value.trim() || S.pin; S.set.games = $('#sg').checked; S.set.links = $('#sl').checked; save(); render(); break;
    case 'wipe': guard('Erase all progress for ' + S.name + ' on this device? This cannot be undone.', () => { const cls = S.cls, pin = S.pin; S = fresh(); S.cls = cls; S.pin = pin; S.known = SK.map(x => x.id); syncMax(); V = {view: 'home'}; }); break;
  }
});
document.addEventListener('change', e => {
  const id = e.target.id, v = e.target.value;
  if (id === 'plv') { V.plv = +v; render(); }
  else if (id === 'shsrc') { Object.assign(V, {shSrc: v, shT: null, shK: null, sheet: null, sherr: ''}); render(); }
  else if (id === 'sht') { Object.assign(V, {shT: v, shK: null, sheet: null, sherr: ''}); render(); }
  else if (id === 'shk') { Object.assign(V, {shK: v, sheet: null, sherr: ''}); render(); }
  else if (id === 'shtype') { Object.assign(V, {shType: v, sheet: null, sherr: ''}); render(); }
  else if (id === 'rfile' && e.target.files[0]) restore(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (V.view === 'speed' && !V.modal) { if (!V.t0) { if (e.key === 'Enter') speedGo(); } else if (/^\d$/.test(e.key)) speedKey(e.key); else if (e.key === 'Backspace') speedKey('⌫'); return; }
  if (e.key !== 'Enter') return;
  if (V.modal) { e.preventDefault(); return $('[data-act=myes]')?.click(); }
  if (V.ask?.state === 'open' && $('#ans')) { e.preventDefault(); submitAns($('#ans').value); }
  else if (V.ask && V.ask.state !== 'open') { e.preventDefault(); nextAsk(); }
  else if (V.view === 'welcome') $('[data-act=setname]')?.click();
});
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });
render();
</script>
