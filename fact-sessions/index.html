<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fact Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1d2127; --muted:#636a74; --line:#e2ddd2; --line2:#cfc8ba;
  --accent:#2c5a86; --accent-ink:#fff; --accent-soft:#e5edf5;
  --s-none:#ebe7df; --s-learn:#e0705a; --s-slow:#efb648; --s-grow:#a8d08c; --s-secure:#3c9558;
  --ok:#3c9558; --warn:#c98a22; --bad:#c4513b;
  --font:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.top .brand{font-weight:700;letter-spacing:.2px;cursor:pointer}
.top .brand span{opacity:.6;font-weight:400}
.top .crumb{opacity:.85}
.top .sp{flex:1}
.top .bk{font-size:13px;opacity:.85}
.top button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.1)}
.top .warnbk{color:#ffd27a}
main{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:4px 0 6px}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:14px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:11px 20px;font-size:17px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin:14px 0 18px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;color:var(--muted);font-weight:700}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700}
.chip.grey{background:#efece6;color:var(--muted)}
.gcard h3{margin:0 0 2px;font-size:18px}
.gcard .stu{color:var(--muted);margin-bottom:10px}
.gcard .pos{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 12px;font-size:15px}
.gcard .pos b{white-space:nowrap}
label.fld{display:block;margin:8px 0}
label.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;width:100%}
textarea{min-height:70px}
table.ed{border-collapse:collapse;width:100%}
table.ed td,table.ed th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.how ol{margin:6px 0 0 0;padding-left:20px}
.how li{margin:5px 0}
.note{background:#fff8e6;border:1px solid #f0dfae;border-radius:8px;padding:10px 12px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}

/* session */
.sesshead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;padding:2px 12px;border-radius:8px;background:#fff;border:1px solid var(--line)}
.timer.over{color:var(--warn);border-color:var(--warn)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.steps button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps button.done{border-color:var(--ok);color:var(--ok)}
.script{font-size:15px;background:var(--accent-soft);border-left:4px solid var(--accent);padding:9px 12px;border-radius:6px;margin:0 0 14px}
.studycols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.studycard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.studycard h3{margin:0 0 8px;font-size:20px}
.studyfact{font-size:30px;font-weight:700;margin:4px 0;letter-spacing:.3px}
.studyfact.add{font-size:24px}
.tip{color:var(--muted);font-size:14px;margin:2px 0 10px}
.qf{display:grid;grid-template-columns:1fr;gap:12px;justify-items:center;text-align:center;padding:16px}
.qf .who{font-size:22px;font-weight:700;padding:4px 18px;border-radius:999px;background:var(--ink);color:#fff}
.qf .who.s1{background:#7a4ea3}
.qf .kind{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.qf .q{font-size:84px;font-weight:700;line-height:1.05;letter-spacing:1px}
.qf .ans{font-size:44px;font-weight:700;color:var(--accent);min-height:56px}
.qf .ans.hide{color:transparent}
.qf .ansbtn{font-size:14px}
.qf .mark{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.qf .mark button{font-size:19px;padding:12px 20px;border-radius:10px;border:2px solid;background:#fff;cursor:pointer;min-width:170px}
.qf .mark .m-ok{border-color:var(--ok);color:var(--ok)}
.qf .mark .m-slow{border-color:var(--warn);color:var(--warn)}
.qf .mark .m-bad{border-color:var(--bad);color:var(--bad)}
.qf .mark button:hover{filter:brightness(.95);background:#fafafa}
.qf .k{font-size:12px;opacity:.7;display:block}
.rehearse{background:#fff3ef;border:1px solid #f0c7bb;border-radius:8px;padding:8px 14px;font-size:17px}
.progressbar{height:8px;background:#e8e4db;border-radius:999px;overflow:hidden;width:min(520px,90%)}
.progressbar i{display:block;height:100%;background:var(--accent)}
.ladder{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.ladder button{min-width:58px;height:52px;font-size:22px;font-weight:700;border:2px dashed var(--line2);border-radius:8px;background:#fff;cursor:pointer}
.ladder button.shown{border-style:solid;border-color:var(--accent);color:var(--accent)}
.sumtab{border-collapse:collapse;width:100%}
.sumtab td,.sumtab th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}

/* maps */
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 10px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.st-none{background:var(--s-none)} .st-learn{background:var(--s-learn)} .st-slow{background:var(--s-slow)} .st-grow{background:var(--s-grow)} .st-secure{background:var(--s-secure)}
table.mgrid{border-collapse:separate;border-spacing:3px}
table.mgrid th{font-size:13px;color:var(--muted);width:34px;height:26px;font-weight:700}
table.mgrid th.cur{color:var(--accent);background:var(--accent-soft);border-radius:4px}
table.mgrid td{width:34px;height:30px;border-radius:5px;text-align:center;font-size:12px;cursor:pointer;color:rgba(0,0,0,.55);font-weight:700}
table.mgrid td.st-secure,table.mgrid td.st-learn{color:#fff}
table.mgrid td:hover{outline:2px solid var(--ink)}
.big table.mgrid td{width:50px;height:42px;font-size:15px}
.big table.mgrid th{width:50px;font-size:16px}
.famrow{display:grid;grid-template-columns:minmax(150px,220px) 1fr 70px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.famrow .lab{font-weight:700}
.famrow .lab small{display:block;font-weight:400;color:var(--muted)}
.famrow.cur .lab{color:var(--accent)}
.bar{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--s-none)}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 4px}
.chips button{border:none;border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;font-weight:700;color:rgba(0,0,0,.65)}
.chips button.st-secure,.chips button.st-learn{color:#fff}
details.fam summary{cursor:pointer;list-style:none}
details.fam summary::-webkit-details-marker{display:none}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:50;overflow:auto;padding:24px}
.overlay .close{position:fixed;top:14px;right:18px}

/* sheet preview */
.preview{background:#d9d4c9;border-radius:var(--r);padding:16px;overflow:auto;max-height:78vh}
.preview .sheet{background:#fff;margin:0 auto 16px;box-shadow:0 2px 8px rgba(0,0,0,.15);width:210mm;min-height:297mm;padding:12mm}
#print{display:none}

/* printable sheet */
.sheet{font-family:var(--font);color:#111}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:6px}
.sheet .sh-title{font-size:20px;font-weight:700}
.sheet .sh-name{font-size:18px}
.sheet .sh-meta{font-size:12px;color:#555;text-align:right}
.sheet .rule{font-size:13px;margin:4px 0 8px}
.sheet .part{border:1.5px solid #111;border-radius:8px;padding:7px 10px 9px;margin:0 0 9px;break-inside:avoid}
.sheet .part h2{font-size:16px;margin:0 0 4px;display:flex;justify-content:space-between;gap:10px}
.sheet .part h2 small{font-weight:400;font-size:12px;color:#444}
.sheet .study{border:1px dashed #777;border-radius:6px;padding:5px 9px;margin:3px 0 4px;font-size:15px;background:#f7f7f4}
.sheet .study b{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#555;margin-right:6px}
.sheet .study .sf{display:inline-block;margin-right:16px;font-weight:700}
.sheet .study .stip{display:block;font-size:12px;color:#444;margin-top:2px}
.sheet .fold{font-size:10px;color:#888;text-align:center;border-top:1px dashed #aaa;margin:2px 0 6px;line-height:1.2;padding-top:1px}
.sheet .qs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
.sheet .qs.c3{grid-template-columns:repeat(3,1fr)}
.sheet .qi{display:flex;align-items:center;gap:6px;font-size:20px;white-space:nowrap}
.sheet .qi .n{font-size:11px;color:#777;min-width:16px;text-align:right}
.sheet .bx{display:inline-block;width:54px;height:31px;border:1.3px solid #333;border-radius:4px;vertical-align:middle;background:#fff}
.sheet .bx.sm{width:40px}
.sheet .chainrow{display:flex;gap:8px;align-items:center;font-size:20px;margin:4px 0 9px;flex-wrap:wrap}
.sheet .chainrow .arr{color:#888}
.sheet .lad{display:flex;gap:4px;align-items:center;margin:3px 0 6px;font-size:16px;flex-wrap:wrap}
.sheet .lad .lab{font-size:12px;color:#444;margin-right:4px;min-width:84px}
.sheet .lad .bx{width:38px;height:26px}
.sheet .sh-foot{display:flex;justify-content:space-between;font-size:13px;border-top:1px solid #999;padding-top:5px;margin-top:4px}
.sheet .keyblock{font-size:12px;margin:0 0 8px;break-inside:avoid}
.sheet .keyblock h3{font-size:13px;margin:4px 0 2px}
.sheet .keygrid{display:flex;flex-wrap:wrap;gap:2px 12px}

/* report */
.report h1{font-size:24px;margin:0}
.report .rsub{color:#555;margin-bottom:10px}
.report h2{font-size:17px;margin:14px 0 6px;border-bottom:1px solid #ccc;padding-bottom:3px}
.report table.mgrid td{cursor:default}
.report .home li{margin:4px 0}

@media print{
  @page{size:A4;margin:11mm}
  html,body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block!important}
  #print .sheet{page-break-after:always;break-after:page;width:auto;min-height:0;padding:0;box-shadow:none}
  #print .sheet:last-child{page-break-after:auto;break-after:auto}
  .st-none,.st-learn,.st-slow,.st-grow,.st-secure,.bar i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:700px){ .qf .q{font-size:56px} .famrow{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top" id="top"></div>
<main id="app"></main>
<div id="print"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   Fact Practice — a teacher-facing tool for 1–3 students
   per class who need fact-family practice.
   Everything is saved in this browser (localStorage).
   Use Settings → Export backup to keep a copy.
   ========================================================= */

// ---------- small utilities ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => s ? parseD(s).toLocaleDateString('en-NZ', {day: 'numeric', month: 'short'}) : '—';
const fmtLong = s => s ? parseD(s).toLocaleDateString('en-NZ', {weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'}) : '—';
const daysAgo = s => Math.round((parseD(todayStr()) - parseD(s)) / 86400000);
const uid = () => Math.random().toString(36).slice(2, 9);
function weekKey(s = todayStr()) { const d = parseD(s); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); return d.toISOString().slice(0, 10); }
function hashStr(s) { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } return h >>> 0; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rngFrom = s => mulberry(hashStr(String(s)));
const RI = (r, a, b) => a + Math.floor(r() * (b - a + 1));
function shuffle(arr, r) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickW(items, wfn, r) { let tot = 0; const ws = items.map(x => { const w = Math.max(0, wfn(x)); tot += w; return w; }); if (!items.length) return null; if (tot <= 0) return items[Math.floor(r() * items.length)]; let x = r() * tot; for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; } return items[items.length - 1]; }

// ---------- fact families (strands) ----------
// Each family: {id,label,eg,tip,facts:[{key,show,chip,make(r)->{q,a,blank?}}], chains?, n?}
// To add a new strand later: write a build function like the ones below and register it in STRANDS.
const F = (key, show, chip, make, extra = {}) => ({key, show, chip, make, ...extra});

function addBaseKey(u, v) { const s = u + v; if (s === 10) return 'a1:' + u; return 'a2:' + Math.min(u, v) + '+' + Math.max(u, v); }
function buildAdd() {
  const fams = [];
  const a1 = []; for (let n = 1; n <= 9; n++) a1.push(F('a1:' + n, `${n} + ${10 - n} = 10`, `${n} + □`, r => r() < .5 ? {q: `${n} + □ = 10`, a: 10 - n, blank: 1} : {q: `□ + ${n} = 10`, a: 10 - n, blank: 1}));
  fams.push({id: 'a1', label: 'Bonds to 10', eg: '7 + □ = 10', tip: 'Pairs that make 10: 9 and 1, 8 and 2, 7 and 3, 6 and 4, 5 and 5.', facts: a1});
  const a2 = []; for (let a = 2; a <= 9; a++) for (let b = a; b <= 9; b++) if (a + b >= 11) a2.push(F(`a2:${a}+${b}`, `${a} + ${b} = ${a + b}`, `${a} + ${b}`, r => r() < .5 ? {q: `${a} + ${b}`, a: a + b} : {q: `${b} + ${a}`, a: a + b}));
  fams.push({id: 'a2', label: 'Teen facts', eg: '8 + 7', tip: 'Use the 10: 8 + 7 → 8 + 2 makes 10, then 5 more is 15.', facts: a2});
  const a3 = []; for (let u = 1; u <= 9; u++) a3.push(F('a3:' + u, `3${u} + ${10 - u} = 40`, `…${u} + □`, r => { const t = RI(r, 1, 8); return {q: `${t}${u} + □ = ${(t + 1) * 10}`, a: 10 - u, blank: 1}; }));
  fams.push({id: 'a3', label: 'To the next ten', eg: '37 + □ = 40', tip: 'How far to the next ten? 37 → 40 is 3, because 7 + 3 = 10.', facts: a3});
  const a4 = []; for (let u = 1; u <= 8; u++) for (let v = 1; v <= 9 - u; v++) a4.push(F(`a4:${u}+${v}`, `2${u} + ${v} = ${20 + u + v}`, `…${u} + ${v}`, r => { const t = RI(r, 1, 9), A = t * 10 + u; return r() < .25 ? {q: `${v} + ${A}`, a: A + v} : {q: `${A} + ${v}`, a: A + v}; }));
  fams.push({id: 'a4', label: 'Add ones (no new ten)', eg: '23 + 5', tip: 'Only the ones change: 23 + 5 → 3 + 5 = 8, so 28.', facts: a4});
  const a5 = []; for (let u = 1; u <= 9; u++) for (let v = 2; v <= 9; v++) if (u + v >= 10) {
    const base = addBaseKey(u, v), key = `a5:${u}+${v}`;
    a5.push(F(key, `${u} + ${v} = ${u + v}  →  2${u} + ${v} = ${20 + u + v}`, `…${u} + ${v}`,
      r => { const t = RI(r, 1, 8), A = t * 10 + u; return r() < .2 ? {q: `${v} + ${A}`, a: A + v} : {q: `${A} + ${v}`, a: A + v}; },
      {chain: r => { const ts = shuffle([1, 2, 3, 4, 5, 6, 7, 8], r).slice(0, 2).sort((x, y) => x - y); return [{q: `${u} + ${v}`, a: u + v, key: base}, ...ts.map(t => ({q: `${t * 10 + u} + ${v}`, a: t * 10 + u + v, key}))]; }}));
  }
  fams.push({id: 'a5', label: 'Bridge a ten', eg: '28 + 7', tip: 'You know 8 + 7 = 15. So 28 + 7 ends in 5 and goes up a ten: 35.', facts: a5, chains: true});
  const a6 = []; for (let t = 1; t <= 8; t++) for (let s = 1; s <= 9 - t; s++) a6.push(F(`a6:${t}+${s}`, `${t}4 + ${s}0 = ${t + s}4`, `${t}_ + ${s}0`, r => { const u = RI(r, 1, 9); return {q: `${t}${u} + ${s}0`, a: (t + s) * 10 + u}; }));
  fams.push({id: 'a6', label: 'Add tens', eg: '47 + 30', tip: 'Only the tens change: 47 + 30 → 4 tens + 3 tens = 7 tens, so 77.', facts: a6});
  const a7 = []; for (let p = 1; p <= 9; p++) for (let q = p; q <= 9; q++) a7.push(F(`a7:${p}+${q}`, `2${p} + 1${q} = ${30 + p + q}`, `…${p} + …${q}`, r => {
    const c = (p + q >= 10) ? 1 : 0, t1 = RI(r, 1, 8 - c), t2 = RI(r, 1, 9 - c - t1); const [u1, u2] = r() < .5 ? [p, q] : [q, p]; const A = t1 * 10 + u1, B = t2 * 10 + u2; return {q: `${A} + ${B}`, a: A + B};
  }));
  fams.push({id: 'a7', label: 'Two 2-digit numbers', eg: '47 + 36', tip: 'Tens first, then ones: 47 + 36 → 47 + 30 = 77, then + 6 = 83.', facts: a7});
  return fams;
}
function subBaseKey(u, v) { if (u === 0) return 's1:' + v; return `s2:${10 + u}-${v}`; }
function buildSub() {
  const fams = [];
  const s1 = []; for (let n = 1; n <= 9; n++) s1.push(F('s1:' + n, `10 − ${n} = ${10 - n}`, `10 − ${n}`, () => ({q: `10 − ${n}`, a: 10 - n})));
  fams.push({id: 's1', label: 'Take from 10', eg: '10 − 3', tip: 'Use your bonds to 10: 7 + 3 = 10, so 10 − 3 = 7.', facts: s1});
  const s2 = []; for (let a = 2; a <= 9; a++) for (let b = 2; b <= 9; b++) if (a + b >= 11) s2.push(F(`s2:${a + b}-${b}`, `${a + b} − ${b} = ${a}`, `${a + b} − ${b}`, () => ({q: `${a + b} − ${b}`, a})));
  fams.push({id: 's2', label: 'Teen take-aways', eg: '15 − 7', tip: 'Think addition: 7 + what makes 15? 7 + 8 = 15, so 15 − 7 = 8.', facts: s2});
  const s3 = []; for (let u = 1; u <= 9; u++) s3.push(F('s3:' + u, `4${u} − ${u} = 40`, `…${u} − ${u}`, r => { const t = RI(r, 1, 9); return {q: `${t}${u} − ${u}`, a: t * 10}; }));

// ---------- session ----------
function startSession(g, mode) {
  const r = rngFrom(uid());
  const perStudent = g.students.map((stu, si) => {
    const units = strandsOf(g).flatMap(sid => {
      const pos = g.pos[sid], k = mode === 'long' ? ((sid === 'mult' || sid === 'div') ? 2 : 1) : 1;
      const tg = pickTargets(stu, sid, pos, k), pool = knownPool(stu, sid, pos, tg);
      return tg.map(t => ({t, pool, sid}));
    });
    const pat = mode === 'long' ? 'TKTKKT' : 'TKT', seq = [];
    let lastKey = null;
    for (const ch of pat) for (const u of units) {
      let f = u.t, kind = 'T';
      if (ch === 'K') { kind = 'K'; let tries = 0; do { f = u.pool[Math.floor(r() * u.pool.length)]; } while (f.key === lastKey && ++tries < 5); }
      lastKey = f.key;
      seq.push({si, stuId: stu.id, name: stu.name, sid: u.sid, key: f.key, kind, ...f.make(r), tries: 0});
    }
    return seq;
  });
  const deck = [], maxLen = Math.max(0, ...perStudent.map(s => s.length));
  for (let i = 0; i < maxLen; i++) perStudent.forEach(s => { if (s[i]) deck.push(s[i]); });
  SESS = {gid: g.id, mode, step: 'study', deck, i: 0, shown: false, correcting: false, results: [], t0: Date.now(), saved: false, ladderShown: {}, note: ''};
}

      <div class="row"><button class="btn primary big" data-act="sess" data-mode="short">Start 2–3 min session</button><button class="btn big" data-act="sess" data-mode="long">Start 5 min session</button></div>
      <p class="small muted" style="margin-top:10px">Short: study → about ${g.students.length * strandsOf(g).length * 3} quick-fire questions → wrap-up. Long: adds a count-up ladder and about twice the questions.</p></div>
      ${prev.length ? `<h2>Recent sessions</h2><div class="panel"><table class="sumtab"><tr><th>Date</th><th>Type</th><th>Questions</th><th>✓ / slow / ✗</th><th>Time</th></tr>${prev.map(s => `<tr><td>${fmtDate(s.date)}</td><td>${s.mode === 'long' ? '5 min' : '2–3 min'}</td><td>${s.n}</td><td><span class="ok">${s.ok}</span> / <span class="warn">${s.slow}</span> / <span class="bad">${s.wrong}</span></td><td>${Math.floor(s.dur / 60)}:${pad(s.dur % 60)}</td></tr>`).join('')}</table></div>` : ''}`;
  }
  const steps = SESS.mode === 'long' ? [['ladder', 'Ladder'], ['study', 'Study'], ['quick', 'Quick-fire'], ['wrap', 'Wrap-up']] : [['study', 'Study'], ['quick', 'Quick-fire'], ['wrap', 'Wrap-up']];
  const order = steps.map(s => s[0]);
  const head = `<div class="sesshead"><span class="timer" id="timer">0:00</span><div class="steps">${steps.map(([k, l]) => `<button class="${SESS.step === k ? 'on' : order.indexOf(k) < order.indexOf(SESS.step) ? 'done' : ''}" data-act="step" data-step="${k}">${l}</button>`).join('')}</div><span style="flex:1"></span><button class="btn ghost" data-act="endsess">${SESS.saved ? 'Close' : 'Discard session'}</button></div>`;

function ladderStepHTML(g) {
  let h = `<p class="script">Say: “Count up with me — just the answers.” Click each box as they say it, then count back down. About 1 minute. Then ask a few jumps: “What’s 6 lots? 7 lots?”</p>`;
  for (const sid of strandsOf(g)) {
    const fam = STRANDS[sid].families[g.pos[sid].fam];
    let seq = null, title = '';
    if (fam.n && sid === 'mult') { seq = Array.from({length: 10}, (_, i) => ({l: `${i + 1} × ${fam.n}`, v: (i + 1) * fam.n})); title = `Count up in ${fam.n}s`; }
    else if (fam.n && sid === 'div') { seq = Array.from({length: 10}, (_, i) => ({l: `${(i + 1) * fam.n} ÷ ${fam.n}`, v: i + 1})); title = `Divide by ${fam.n}`; }
    else if (fam.chains && sid === 'add') { const r =rngFrom(weekKey() + g.id); const ff = pickW(fam.facts, () => 1, r); const [u, v] = ff.key.slice(3).split('+').map(Number); seq = Array.from({length: 9}, (_, t) => ({l: `${t * 10 + u} + ${v}`, v: t * 10 + u + v})); title = `Same ones, up a ten each time`; }

function markResult(res) {
  if (SESS.correcting) return;
  const p = SESS.deck[SESS.i];
  const rec = {i: SESS.i, res, inserted: null};
  SESS.results.push(rec);
  if (res !== 'ok') {
    // incremental rehearsal: tell them now, then it comes back a few questions later
    if (p.tries < 2) { const at = Math.min(SESS.deck.length, SESS.i + 3); SESS.deck.splice(at, 0, {...p, tries: p.tries + 1}); rec.inserted = at; }
    SESS.correcting = true;
  } else { SESS.i++; SESS.shown = false; }
  render();
}
function nextPrompt() { SESS.correcting = false; SESS.i++; SESS.shown = false; render(); }
function undoResult() {
  const rec = SESS.results.pop(); if (!rec) return;
  if (rec.inserted !== null) SESS.deck.splice(rec.inserted, 1);
  SESS.i = rec.i; SESS.shown = false; SESS.correcting = false;
  render();
}
function resultPrompts() { // reconstruct which prompt each result referred to
  const out = []; const deck = SESS.deck;
  // results reference indexes in the deck as it stood when marked; later insertions only happen after the marked index, so indexes stay valid.
  SESS.results.forEach(r => out.push({...deck[r.i], res: r.res}));
  return out;
}

function saveSession(g) {
  const day = todayStr(); const rp = resultPrompts();

// ---------- progression ----------
function suggestion(g, sid) {
  const pos = g.pos[sid], st = STRANDS[sid], fam = st.families[pos.fam];
  const stats = g.students.map(stu => famStats(stu, sid, pos.fam));
  const good = stats.map(c => (c.secure + c.grow) / c.total), sec = stats.map(c => c.secure / c.total);
  const minGood = Math.min(...good), minSec = Math.min(...sec);
  const last = pos.fam === st.families.length - 1;
  if (pos.stage === 'blocked' && pos.fam === 0) { if (minGood >= .7) return {ready: true, act: 'next', msg: `Both are mostly getting ${fam.label} right. The first family has nothing to mix with, so move to the next family.`}; }
  else if (pos.stage === 'blocked') { if (minGood >= .7) return {ready: true, act: 'mixed', msg: `${Math.round(minGood * 100)}%+ of ${fam.label} answered correctly. Ready to mix it with earlier families.`}; }
  else if (minSec >= .8 && !last) return {ready: true, act: 'next', msg: `${Math.round(minSec * 100)}%+ of ${fam.label} is secure. Ready for the next family.`};
  else if (minSec >= .8 && last) return {ready: false, msg: `${fam.label} is secure — that’s the whole ${st.name.toLowerCase()} strand. Keep a weekly check going, or switch on another strand.`};
  const need = pos.stage === 'blocked' ? `aim for 70% right (lowest is ${Math.round(minGood * 100)}%)` : `aim for 80% secure (lowest is ${Math.round(minSec * 100)}%)`;
  return {ready: false, msg: `Keep going on ${fam.label} — ${need}.`};
}
function progressionHTML(g) {
  return `<div class="grid2">${strandsOf(g).map(sid => {
    const s = suggestion(g, sid), pos = g.pos[sid], st = STRANDS[sid];
    return `<div class="panel"><h3 style="margin-top:0">${st.name}: ${famName(g, sid)}</h3><p class="${s.ready ? 'ok' : 'muted'}">${s.ready ? '<b>Ready.</b> ' : ''}${esc(s.msg)}</p>
      <div class="row small">${pos.stage === 'blocked' && pos.fam > 0 ? `<button class="btn ${s.ready && s.act === 'mixed' ? 'primary' : ''}" data-act="prog" data-sid="${sid}" data-do="mixed">Move to mixed</button>` : ''}
      ${pos.fam < st.families.length - 1 ? `<button class="btn ${s.ready && s.act === 'next' ? 'primary' : ''}" data-act="prog" data-sid="${sid}" data-do="next">Next family: ${esc(st.families[pos.fam + 1].label)}</button>` : ''}
      ${pos.fam > 0 || pos.stage === 'mixed' ? `<button class="btn ghost" data-act="prog" data-sid="${sid}" data-do="back">Step back</button>` : ''}</div></div>`;
  }).join('')}</div>`;
}
function progress(g, sid, what) {
  const pos = g.pos[sid], n = STRANDS[sid].families.length;
  if (what === 'mixed') pos.stage = 'mixed';
  else if (what === 'next' && pos.fam < n - 1) { pos.fam++; pos.stage = 'blocked'; }
  else if (what === 'back') { if (pos.stage === 'mixed') pos.stage = 'blocked'; else if (pos.fam > 0) { pos.fam--; pos.stage = 'mixed'; } }
  save(); render();
}

function saveLog(g) {

// ---------- demo ----------
function makeDemo() {
  const g = newGroup('Demo 9X', ['Aroha', 'Ben']);
  g.pos.add = {fam: 4, stage: 'blocked'}; g.pos.mult = {fam: 4, stage: 'blocked'};
  const r = rngFrom('demo');
  const d1 = new Date(); d1.setDate(d1.getDate() - 14); const old = d1.toISOString().slice(0, 10);
  g.students.forEach((stu, si) => {
    for (const sid of ['add', 'mult']) STRANDS[sid].families.forEach((fam, fi) => fam.facts.forEach(f => {
      if (!countable(f.key)) return;
      const cur = g.pos[sid].fam; let p = fi < cur ? .85 : fi === cur ? .3 : .05; p -= si * .1;
      const x = r(); if (x < p) setManual(stu, f.key, 'secure'); else if (x < p + .15) setManual(stu, f.key, 'grow'); else if (x < p + .3 && fi <= cur + 1) setManual(stu, f.key, r() < .5 ? 'slow' : 'learn');
    }));
    stu.hist = [{d: old, s: {add: Math.round(strandStats(stu, 'add').secure * .6), mult: Math.round(strandStats(stu, 'mult').secure * .6)}, t: {}}];
    snapshot(stu, g);
  });
  g.sessions.push({date: old, mode: 'short', n: 12, ok: 8, slow: 2, wrong: 2, dur: 150, note: ''});
  S.groups.push(g); save();
}
function newGroup(name, names) {
  return {id: uid(), name, students: names.map(n => ({id: uid(), name: n, facts: {}, hist: [], note: ''})), strands: ['add', 'mult'], pos: {add: {fam: 0, stage: 'blocked'}, mult: {fam: 0, stage: 'blocked'}}, sessions: [], sheets: [], created: todayStr()};
}

  const k = e.key.toLowerCase();
  if (SESS.correcting) {
    if (k === 'backspace') { e.preventDefault(); undoResult(); }
    else if ([' ', 'enter', 'arrowright', '1', '2', '3', 'j', 'k', 'l'].includes(k)) { e.preventDefault(); nextPrompt(); }
    return;
  }
  if (k === ' ') { e.preventDefault(); SESS.shown = !SESS.shown; render(); }
  else if (k === '1' || k === 'j') markResult('ok');
  else if (k === '2' || k === 'k') markResult('slow');
  else if (k === '3' || k === 'l') markResult('wrong');
  else if (k === 'backspace') { e.preventDefault(); undoResult(); }
});
function saveGroupForm() {
  const g = UI.editing;
  const name = $('#gname').value.trim(); if (!name) { alert('Give the group a name (e.g. the class code).'); return; }
  const names = [0, 1, 2].map(i => $(`[data-stu="${i}"]`).value.trim());
  const students = [];
  for (let i = 0; i < 3; i++) {
    const existing = g.students[i];
    if (names[i]) students.push(existing ? {...existing, name: names[i]} : {id: uid(), name: names[i], facts: {}, hist: [], note: ''});
    else if (existing && Object.keys(existing.facts).length && !confirm(`Remove ${existing.name} and their progress?`)) students.push(existing);
  }
  if (!students.length) { alert('Add at least one student.'); return; }
  const strands = STRAND_ORDER.filter(sid => $(`[data-strand="${sid}"]`).checked);
  if (!strands.length) { alert('Switch on at least one strand.'); return; }
  const pos = {...g.pos};
  STRAND_ORDER.forEach(sid => { pos[sid] = {fam: +$(`[data-fam="${sid}"]`).value, stage: $(`[data-stage="${sid}"]`).value}; });
  Object.assign(g, {name, students, strands, pos});
  if (!g.id) { g.id = uid(); S.groups.push(g); }
  else { const i = S.groups.findIndex(x => x.id === g.id); S.groups[i] = g; if (SESS?.gid === g.id) SESS = null; }
  ensurePos(g); save(); go('group', {gid: g.id, tab: 'session'});
}

render();
</script>
