<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Challenges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark ink masthead with the tabs, then a quest log of cards with a coloured spine per kind. Marigold is reserved for points and this week's picks. */
:root{
  --paper:#f2f4f9; --card:#ffffff; --ink:#141b30; --muted:#566080; --line:#d7dcea;
  --mast:#141b30; --mast-ink:#f2f4f9; --mast-muted:#a9b2cc;
  --gold:#f2a900; --gold-ink:#3d2a00; --gold-soft:#fff3d1;
  --ok:#17794e; --ok-soft:#dcf3e7; --wait:#9a5b00; --wait-soft:#ffecc7; --bad:#b3261e;
  --k-level:#2b63d9; --k-puzzle:#6a45c4; --k-explore:#17794e; --k-play:#c82d68; --k-compete:#b86100; --k-create:#0b7f8c; --k-report:#5b6b00;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1322; --card:#182036; --ink:#e9ecf6; --muted:#9aa4c2; --line:#2b3552;
    --mast:#090d18; --mast-ink:#f2f4f9; --mast-muted:#9aa4c2;
    --gold:#f5b829; --gold-ink:#2b1d00; --gold-soft:#3a2f10;
    --ok:#5fd19b; --ok-soft:#143526; --wait:#f0b64e; --wait-soft:#3a2c0d; --bad:#ff8a80;
    --k-level:#7ea6ff; --k-puzzle:#b095ff; --k-explore:#5fd19b; --k-play:#ff7fae; --k-compete:#f0a04e; --k-create:#5cc8d4; --k-report:#c3d65c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1322; --card:#182036; --ink:#e9ecf6; --muted:#9aa4c2; --line:#2b3552;
  --mast:#090d18; --mast-ink:#f2f4f9; --mast-muted:#9aa4c2;
  --gold:#f5b829; --gold-ink:#2b1d00; --gold-soft:#3a2f10;
  --ok:#5fd19b; --ok-soft:#143526; --wait:#f0b64e; --wait-soft:#3a2c0d; --bad:#ff8a80;
  --k-level:#7ea6ff; --k-puzzle:#b095ff; --k-explore:#5fd19b; --k-play:#ff7fae; --k-compete:#f0a04e; --k-create:#5cc8d4; --k-report:#c3d65c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-top:20px}
.mast h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.01em}
.mast h1 span{color:var(--gold)}
.mast .brand{padding-bottom:14px}
.mast .sub{color:var(--mast-muted);font-size:.9rem;margin-top:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{display:block;padding:10px 14px;border-radius:var(--r) var(--r) 0 0;text-decoration:none;color:var(--mast-muted);font-weight:700}
.tabs a:hover{color:var(--mast-ink)}
.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink)}

main{padding:20px 0 48px}
.stack{display:flex;flex-direction:column;gap:20px}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;font-size:.95rem}
.note.plain{background:var(--card);border-color:var(--line)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.925rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:7px 8px}
.btn.quiet:hover{color:var(--ink)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
label{font-weight:700;font-size:.875rem;display:flex;flex-direction:column;gap:4px}
label.inline{flex-direction:row;align-items:center;gap:6px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

/* this week */
.week h2,.sect h2{font-size:1.25rem}
.week .head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .gap{flex:1 1 20px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.875rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--kc)}

.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--kc);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.card.pick{border-top:3px solid var(--gold)}
.k-level{--kc:var(--k-level)}.k-puzzle{--kc:var(--k-puzzle)}.k-explore{--kc:var(--k-explore)}.k-play{--kc:var(--k-play)}.k-compete{--kc:var(--k-compete)}.k-create{--kc:var(--k-create)}.k-report{--kc:var(--k-report)}
.card .top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.8rem}
.kind{color:var(--kc);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tag{border-radius:5px;padding:1px 7px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.tag.new{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tag.hid{background:var(--wait-soft);color:var(--wait);border-color:transparent}
.pts{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pips{color:var(--gold);letter-spacing:1px}
.card h3{font-size:1.15rem}
.card .blurb{font-size:.95rem}
.card .how{font-size:.875rem;color:var(--muted)}
.card .social{font-size:.875rem;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.card .social b{font-weight:700}
.unsolved{color:var(--k-play);font-weight:700}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.status{font-size:.875rem;font-weight:700;border-radius:6px;padding:4px 8px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.wait{background:var(--wait-soft);color:var(--wait)}

/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:1.15rem}
.panel .lede{font-size:.875rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:4px 8px}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.me td{background:var(--gold-soft);font-weight:700}
.rank{font-family:var(--display);font-weight:800;width:2.2em}
.bar{height:8px;border-radius:4px;background:var(--gold);min-width:3px}
.kd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;background:var(--kc);opacity:.18}
.kd.on{opacity:1}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{font-size:.95rem}
.rec{border-top:1px solid var(--line);padding-top:8px}
.rec:first-of-type{border-top:0;padding-top:0}
.rec .ttl{font-weight:700}
.rec ol{margin:4px 0 0;padding-left:1.4em}

/* teacher */
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.form .full{grid-column:1/-1}
.form input[type=text],.form select,.form textarea{width:100%}
.form textarea{font-family:var(--body);font-size:.95rem;min-height:64px}
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:4px 16px}
.ticks label{flex-direction:row;align-items:center;font-weight:400;gap:8px;font-size:.95rem;padding:3px 0}
.ticks input[type=number]{width:90px;padding:3px 6px}

/* topics */
.topic{display:flex;flex-direction:column;gap:10px}
.topic .th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;border-bottom:2px solid var(--line);padding-bottom:6px}
.topic .th h3{font-size:1.15rem}
.classline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.cgrid td,.cgrid th{text-align:center;white-space:nowrap}
.cgrid td:first-child,.cgrid th:first-child{text-align:left;white-space:normal}
.cgrid input[type=text]{width:110px;text-align:center;font-weight:700}
/* ladder, reports, resources */
.rung .th h3{font-size:1.15rem}
.rung.locked .th h3{color:var(--muted)}
.rung.locked{opacity:.8}
.lock{font-size:.9rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.tier{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.875rem;color:var(--muted)}
.tier b{color:var(--ink)}
details.help{font-size:.875rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}
details.help summary{cursor:pointer;font-weight:700}
details.help ol{margin:6px 0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px}
.res td{vertical-align:top}
.res td.rnote{min-width:220px;color:var(--muted);font-size:.875rem}
/* my progress */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.tile .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .lab{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dirs{display:flex;flex-wrap:wrap;gap:6px}
.dirs span{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;border:1.5px solid var(--kc);color:var(--kc)}
.dirs span.off{opacity:.35}
.chk{color:var(--ok);font-weight:700}
footer{color:var(--muted);font-size:.8rem;padding:0 0 32px}
@media (max-width:480px){.grid{grid-template-columns:1fr}.boards{grid-template-columns:1fr}.pts{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <div class="brand"><h1 id="title"></h1><p class="sub" id="sub"></p></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Many of these quests come from Dylan Kane's <a href="https://fivetwelvethirteen.substack.com/p/glimpses" target="_blank" rel="noopener">Glimpses</a> list, Play With Your Math, Naoki Inaba, Transum and Math With Bad Drawings. Everything you tick is saved on this device only. Nothing about you is sent anywhere.</div></footer>

<script src="data.js"></script>
<script>
"use strict";
/* Maths Challenges. Each student's progress is saved in their own browser only.
   data.js holds the content Mr Sawyer controls (classes, topics, quests, resources) and no student information. */
const NEW_DAYS = 14, PICKS = 3;
const KEY_ME = "mathsChallenges.mine.v1", KEY_T = "mathsChallenges.teacher.v2";
const DIRS = {
  level:   {n:"Level up", d:"The site marks it for you. Earn the trophy. Start here in each topic."},
  puzzle:  {n:"Puzzle",   d:"One right answer, but nobody marks it for you. Stick with it."},
  explore: {n:"Explore",  d:"Open-ended. See how far you can take it."},
  play:    {n:"Play",     d:"A game to play against a friend."},
  create:  {n:"Create",   d:"Make something for other people to use."},
  report:  {n:"Report",   d:"Investigate a question and write it up. Agree a plan with your teacher before you start."},
  compete: {n:"Competition", d:"Real competition papers, one rung at a time."}
};
const DIR_ORDER = Object.keys(DIRS);
const QUEST_DIRS = DIR_ORDER.filter(k => k !== "compete");
const TIER = {1:"Quick", 2:"Solid", 3:"Deep", 5:"Epic"};
const STAGES = ["Not started", "Plan agreed", "Draft done", "Finished"];
const RKINDS = {site:"Website", papers:"Papers or printables", event:"Real competition", app:"App or game", data:"Data", book:"Book"};
const RSTAT = {find:"To find", add:"Found, to add", using:"In use"};
const DEFAULT_OPEN = ["number", "factors"];
const DEFAULT_RUNGS = [{n:0, name:"Team rounds", d:"Get a team together. Open to everyone."}, {n:1, name:"First steps", d:"Short problems in competition style."}];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
function nice(d){ if(!d) return ""; const p = d.split("-"); return (+p[2]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1] + " " + p[0]; }
function daysAgo(d){ return Math.round((new Date(today()) - new Date(d)) / 864e5); }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "x"; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 0x811c9dc5; for(const ch of "mc:" + s){ h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, "0"); } // keeps the PIN out of plain sight in data.js; not real security
function nextYear(name){ return name.replace(/(\d{4})-(\d{2})\s*$/, (m, a, b) => (+a + 1) + "-" + String((+b + 1) % 100).padStart(2, "0")); }
function norm(it, topics){
  const o = {id:it.id || slug(it.title || "quest"), title:it.title || "Untitled", dir:DIRS[it.dir] ? it.dir : "puzzle", topic:topics.some(t => t.id === it.topic) ? it.topic : "any", pts:TIER[+it.pts] ? +it.pts : 2};
  if(it.url) o.url = it.url;
  if(it.src) o.src = it.src;
  if(it.paper) o.paper = true;
  o.blurb = it.blurb || ""; o.how = it.how || "";
  if(it.record && it.record.label) o.record = {label:it.record.label, best:it.record.best === "low" ? "low" : "high"};
  if(o.dir === "compete") o.rung = Math.max(0, Math.round(+it.rung || 0));
  if(it.pass != null && it.pass !== "" && !isNaN(+it.pass)) o.pass = +it.pass;
  if(it.added) o.added = it.added;
  if(it.hidden) o.hidden = true;
  return o;
}
function normRes(r){
  const o = {id:r.id || slug(r.name || "resource"), name:r.name || "Untitled"};
  if(r.url) o.url = r.url;
  o.kind = RKINDS[r.kind] ? r.kind : "site"; o.status = RSTAT[r.status] ? r.status : "add"; o.note = r.note || "";
  return o;
}
function fill(d){ // tolerate a hand-edited or older data file, and drop anything about students
  d = Object.assign({rev:0, published:"", topics:[], classes:[], spotlight:[], rungs:[], resources:[], quests:[]}, d);
  ["players","solves","records","reports","matches","shouts","hall","season","demo"].forEach(k => delete d[k]);
  const s = Object.assign({title:"Maths Challenges", teacher:"your teacher", nudge:true}, d.settings);
  if(s.pin != null){ s.pinHash = hash(String(s.pin)); delete s.pin; }
  if(!s.pinHash) s.pinHash = hash("6767");
  delete s.firstBonus; d.settings = s;
  if(!d.topics.some(t => t.id === "any")) d.topics.unshift({id:"any", name:"Any time"});
  if(!d.rungs.length) d.rungs = clone(DEFAULT_RUNGS);
  d.classes.forEach(c => { c.open = c.open || DEFAULT_OPEN.slice(); c.now = c.now || ""; });
  d.resources = d.resources.map(normRes);
  d.quests = d.quests.map(q => norm(q, d.topics));
  return d;
}

/* ---------- data ---------- */
const PUB = window.SQ_DATA ? fill(clone(window.SQ_DATA)) : null;
let me = Object.assign({cls:"", clsName:"", q:{}, rung:0}, store.get(KEY_ME, {}));
let T = PUB ? store.get(KEY_T, null) : null; // the teacher's working copy of the content; used only while the Teacher tab is unlocked
if(T) T = fill(T);
let unlocked = false, checking = false;      // Teacher tab unlocked; teacher checking a student's progress on this device
const ui = {view:"quests", dir:"all", q:"", todo:false, claiming:null, tsub:"classes", edit:null, flash:"", code:"", restore:false};

function saveMe(){ if(!store.set(KEY_ME, me)) ui.flash = "This browser isn't saving progress. Ask your teacher."; }
function saveT(){ T.rev = (T.rev||0) + 1; store.set(KEY_T, T); }
const D = () => (unlocked && T) ? T : PUB;
const S = () => D().settings;
const dirty = () => unlocked && T && T.rev !== PUB.rev;
const item = id => D().quests.find(x => x.id === id);
const topicName = id => (D().topics.find(t => t.id === id) || {name:id}).name;
const cls = id => D().classes.find(c => c.id === id);
function myClass(){ const c = cls(me.cls); return c && (!me.clsName || c.name === me.clsName) ? c : null; } // a renamed class (new school year) asks again
function openTopics(){ if(me.cls === "*") return D().topics.map(t => t.id); const c = myClass(); return ["any"].concat(c ? c.open : []); }
function visible(){ const o = openTopics(); return D().quests.filter(q => !q.hidden && o.includes(q.topic)); }
function questList(){ return visible().filter(q => q.dir !== "compete"); }
function locked(){ const o = openTopics(); return D().quests.filter(q => !q.hidden && q.dir !== "compete" && !o.includes(q.topic)).length; }
function isNew(it){ return it.added && daysAgo(it.added) >= 0 && daysAgo(it.added) <= NEW_DAYS; }
const mine = id => me.q[id];
const myState = id => mine(id) ? mine(id).s : "";
const done = id => myState(id) === "done";

/* competition ladder */
function compQuests(n){ return D().quests.filter(q => q.dir === "compete" && !q.hidden && (q.rung || 0) === n); }
function passed(q){ const c = mine(q.id); return !!c && c.s === "done" && (q.pass == null || (c.v != null && +c.v >= q.pass)); }
function rungDone(n){ return compQuests(n).some(passed); }
function ladder(){ return D().rungs.filter(r => r.n > 0).slice().sort((a,b) => a.n - b.n); }
function rungOpen(n){ if(me.cls === "*") return true; if(me.rung) return n <= me.rung; const L = ladder(), i = L.findIndex(r => r.n === n); return i <= 0 || rungDone(L[i-1].n); }
function topRung(){ let t = 0; ladder().forEach(r => { if(rungDone(r.n)) t = Math.max(t, r.n); }); return t; }

function picks(){ // this week: pinned first, then an automatic choice that changes each Monday and leans to the class's current topic
  const vis = questList(), c = myClass(), now = c ? c.now : "";
  const pinned = D().spotlight.map(id => vis.find(x => x.id === id)).filter(Boolean);
  const out = pinned.slice(0, PICKS);
  if(out.length < PICKS){
    const d = new Date(), week = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1970,0,5)) / 6048e5);
    const r = rng(week * 7919);

    for(const x of pool){ if(out.length >= PICKS) break; if(!out.some(o => o.dir === x.dir)) out.push(x); }
    for(const x of pool){ if(out.length >= PICKS) break; if(!out.includes(x)) out.push(x); }

      '<label>Competition rung (Competition quests only)<select id="f_rung">' + T.rungs.slice().sort((a,b) => a.n - b.n).map(r => '<option value="' + r.n + '"' + ((it.rung || 0) === r.n ? " selected" : "") + ">" + (r.n ? "Rung " + r.n + ": " : "") + esc(r.name) + "</option>").join("") + "</select></label>" +
      '<label>Score that opens the next rung (optional)<input type="number" id="f_pass" min="0" value="' + (it.pass != null ? it.pass : "") + '"></label>' +
      '<label class="inline"><input type="checkbox" id="f_paper"' + (it.paper ? " checked" : "") + "> Paper copy</label>" +
      '<div class="row full"><button class="btn primary">Save quest</button><button type="button" class="btn quiet" data-act="edit" data-id="">Cancel</button></div></form>';
  } else h += '<p class="lede">Found something good? Add it here. It gets a New tag for two weeks.</p><div><button class="btn primary" data-act="edit" data-id="new">Add a quest</button></div>';
  h += '</section><section class="panel"><h2>Import quests or resources</h2><p class="lede">Paste lines written for you (for example by Claude from a list of links), one per line. Anything with an id you already have is replaced.</p><form data-form="import" class="stack"><textarea id="imp" aria-label="Lines to import" placeholder=\'{"id":"...","title":"...","dir":"puzzle","topic":"any","pts":2, ...}\'></textarea><div class="row"><button class="btn primary">Import</button></div></form></section>';
  h += '<section class="panel"><h2>All quests</h2><p class="lede">Pin a quest to make it one of the weekly picks for every class it is open to. With nothing pinned, three are picked automatically each Monday.</p><div class="tw"><table><thead><tr><th>Quest</th><th>Direction</th><th>Topic</th><th class="num">Pts</th><th></th></tr></thead><tbody>';
  T.topics.forEach(t => T.quests.filter(q => q.topic === t.id).forEach(it => {
    const pin = pinned.includes(it.id);
    h += "<tr><td>" + esc(it.title) + (it.hidden ? ' <span class="tag hid">Hidden</span>' : "") + (it.dir === "compete" ? ' <span class="muted small">' + (it.rung ? "rung " + it.rung : "team") + "</span>" : "") + '</td><td class="small">' + DIRS[it.dir].n + '</td><td class="small">' + esc(t.name) + '</td><td class="num">' + it.pts + '</td><td style="white-space:nowrap"><button class="btn quiet' + (pin ? " on" : "") + '" data-act="pin" data-id="' + it.id + '">' + (pin ? "Pinned" : "Pin") + '</button><button class="btn quiet" data-act="hide" data-id="' + it.id + '">' + (it.hidden ? "Show" : "Hide") + '</button><button class="btn quiet" data-act="edit" data-id="' + it.id + '">Edit</button></td></tr>';
  }));
  return h + "</tbody></table></div></section>";
}
function tResources(){
  const R = T.resources, cnt = r => T.quests.filter(q => q.src && (q.src === r.name || (r.url && q.url && q.url.split("/")[2] === r.url.split("/")[2]))).length;
  let h = '<section class="panel"><h2>Resources</h2><p class="lede">Everything the quests come from, what you have found but not added yet, and what you are still looking for. Students only see the real competitions marked In use, on the Competitions tab.</p>';
  h += '<form data-form="addres" class="form"><label>Name<input type="text" id="r_name" required></label><label>Link (optional)<input type="text" id="r_url" placeholder="https://"></label><label>Kind<select id="r_kind">' + Object.keys(RKINDS).map(k => '<option value="' + k + '">' + RKINDS[k] + "</option>").join("") + '</select></label><label>Status<select id="r_status">' + Object.keys(RSTAT).map(k => '<option value="' + k + '">' + RSTAT[k] + "</option>").join("") + '</select></label><label class="full">Note<input type="text" id="r_note" placeholder="What it is, and what still needs doing"></label><div><button class="btn primary">Add resource</button></div></form></section>';
  Object.keys(RSTAT).forEach(st => {
    const rs = R.filter(r => r.status === st).sort((a,b) => (a.kind === "event") - (b.kind === "event") || a.name.localeCompare(b.name));
    h += '<section class="panel"><h2>' + RSTAT[st] + ' <span class="muted small">' + rs.length + "</span></h2>";
    if(!rs.length){ h += '<p class="muted small">Nothing here.</p></section>'; return; }
    h += '<div class="tw"><table class="res"><thead><tr><th>Resource</th><th>Kind</th>' + (st === "using" ? '<th class="num">Quests</th>' : "") + "<th>Note</th><th>Status</th><th></th></tr></thead><tbody>";
    rs.forEach(r => { h += "<tr><td>" + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + "</a>" : esc(r.name)) + '</td><td class="small">' + RKINDS[r.kind] + "</td>" + (st === "using" ? '<td class="num">' + (r.kind === "event" ? "" : cnt(r)) + "</td>" : "") + '<td class="rnote">' + esc(r.note) + '</td><td><select data-rstat="' + r.id + '" aria-label="Status of ' + esc(r.name) + '">' + Object.keys(RSTAT).map(k => '<option value="' + k + '"' + (r.status === k ? " selected" : "") + ">" + RSTAT[k] + "</option>").join("") + '</select></td><td><button class="btn quiet danger" data-act="delres" data-id="' + r.id + '" data-confirm="1">Remove</button></td></tr>'; });
    h += "</tbody></table></div></section>";
  });
  const md = Object.keys(RSTAT).map(st => "## " + RSTAT[st] + "\n\n" + R.filter(r => r.status === st).map(r => "- " + (r.url ? "[" + r.name + "](" + r.url + ")" : r.name) + (r.note ? ": " + r.note : "")).join("\n")).join("\n\n");
  h += '<section class="panel"><h2>Copy as a list</h2><p class="lede">Markdown, ready to paste into your notes.</p><textarea id="out_res" readonly aria-label="Resources as a list">' + esc(md) + '</textarea><div class="row"><button class="btn" data-act="copy" data-t="out_res">Copy list</button></div></section>';
  return h;
}
function dataFile(d, note){
  const o = clone(d); o.published = today(); const q = o.quests, r = o.resources; delete o.quests; delete o.resources;
  let s = JSON.stringify(o, null, 1); s = s.slice(0, s.lastIndexOf("}")).trimEnd();
  const arr = (k, a) => ',\n "' + k + '": [\n' + a.map(x => "  " + JSON.stringify(x)).join(",\n") + "\n ]";
  return "/* Maths Challenges content. " + note + " " + today() + ". Publish next to index.html. It holds no student information. */\nwindow.SQ_DATA = " + s + arr("resources", r) + arr("quests", q) + "\n};\n";
}
function starter(){ const o = clone(T); o.rev = 1; o.settings.teacher = "your teacher"; o.settings.pinHash = hash("6767"); o.spotlight = []; o.classes.forEach(c => { c.open = DEFAULT_OPEN.slice(); c.now = ""; }); return o; }
function tPublish(){
  const s = T.settings;
  let h = '<section class="panel"><h2>Setup</h2><form data-form="settings" class="form"><label>Page title<input type="text" id="s_title" value="' + esc(s.title) + '"></label><label>What students call you<input type="text" id="s_teacher" value="' + esc(s.teacher) + '"></label><label>New teacher PIN (leave blank to keep it)<input type="text" id="s_pin" inputmode="numeric" autocomplete="off"></label><label class="inline full"><input type="checkbox" id="s_nudge"' + (s.nudge ? " checked" : "") + '> Remind students to start each topic with a Level up quest</label><div><button class="btn primary">Save setup</button></div></form><p class="small muted">The PIN is stored scrambled in data.js. It keeps students out of these screens; it is not real security.</p></section>';
  h += '<section class="panel"><h2>Publish</h2><p class="lede">Students see whatever is in <b>data.js</b> next to the page. On GitHub: open challenges/data.js, press the pencil, select everything, paste, then Commit changes. The page updates within a few minutes. data.js holds content only, never anything about students.</p><div><span class="small ' + (dirty() ? "" : "muted") + '">' + (dirty() ? "Changed on this device since the published copy." : "Matches the published copy.") + '</span></div><textarea id="out_data" readonly aria-label="data.js">' + esc(dataFile(T, "Written by the Teacher tab on")) + '</textarea><div class="row"><button class="btn primary" data-act="copy" data-t="out_data">Copy data.js</button></div></section>';
  h += '<section class="panel"><h2>This device</h2><p class="lede">Your working copy lives in this browser and is only used while this tab is unlocked. The published data.js is also your backup.</p><div class="row"><button class="btn" data-act="loadpub" data-confirm="1">Throw away my changes and reload the published file</button></div></section>';
  h += '<section class="panel"><h2>Share with another teacher</h2><p class="lede">A data.js with your quests, topics and resources, the teacher name set to "your teacher" and the PIN back to 6767. Give them this and index.html.</p><textarea id="out_start" readonly aria-label="Starter data.js">' + esc(dataFile(starter(), "Starter copy made on")) + '</textarea><div class="row"><button class="btn" data-act="copy" data-t="out_start">Copy starter data.js</button></div></section>';
  return h;
}

/* ---------- render and events ---------- */
function render(){
  if(!PUB){ $("#title").textContent = "Maths Challenges"; $("#app").innerHTML = '<p class="note">The quests didn\'t load. Check that <b>data.js</b> is in the same folder as this page.</p>'; return; }
  document.title = S().title;
  $("#title").innerHTML = esc(S().title).replace(/(\S+)$/, "<span>$1</span>");
  const c = myClass(); $("#sub").textContent = (c ? c.name + " · " : "") + "Your progress is saved on this device";
  const tabs = {quests:"Quests", compete:"Competitions", mine:"My progress", teacher:"Teacher"};
  $("#tabs").innerHTML = Object.keys(tabs).map(k => '<a href="#' + k + '"' + (ui.view === k ? ' aria-current="page"' : "") + ">" + tabs[k] + "</a>").join("");
  let h = ({quests:viewQuests, compete:viewCompete, mine:viewMine, teacher:viewTeacher})[ui.view]();
  if(ui.flash && ui.view !== "teacher") h = '<p class="note plain">' + esc(ui.flash) + "</p>" + h;
  $("#app").innerHTML = h;
  ui.flash = "";
}
function route(){ const v = location.hash.replace("#",""); ui.view = ["quests","compete","mine","teacher"].includes(v) ? v : v === "boards" ? "mine" : "quests"; render(); }
window.addEventListener("hashchange", route);
function better(it, a, b){ if(a == null) return b; return it.record.best === "low" ? Math.min(a, b) : Math.max(a, b); }

let armed = null;
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(el.dataset.confirm && armed !== el){ armed = el; el.dataset.label = el.textContent; el.textContent = "Sure? Press again"; setTimeout(() => { if(armed === el){ armed = null; if(el.isConnected) el.textContent = el.dataset.label; } }, 4000); return; }
  armed = null;
  switch(act){
    case "dir": ui.dir = el.dataset.k; break;
    case "toggle": ui[el.dataset.f] = !ui[el.dataset.f]; break;
    case "pickcls": me.cls = id; me.clsName = id && id !== "*" && cls(id) ? cls(id).name : ""; saveMe(); break;
    case "surprise": { ui.q = ""; const pool = filtered().filter(it => !myState(it.id)); if(pool.length) ui.q = pool[Math.floor(Math.random()*pool.length)].title; break; }
    case "try": { const c = mine(id); if(c && c.s === "try") delete me.q[id]; else me.q[id] = {s:"try", d:today()}; saveMe(); break; }
    case "done": { if(item(id).record) ui.claiming = id; else { me.q[id] = Object.assign(mine(id) || {}, {s:"done", d:today()}); saveMe(); } break; }
    case "claim": { const it = item(id), raw = el.closest(".card").querySelector("input[type=number]").value, c = mine(id) || {}, v = raw === "" ? null : +raw;
      me.q[id] = Object.assign(c, {s:"done", d:c.s === "done" ? c.d : today(), v: v == null ? (c.v == null ? null : c.v) : better(it, c.v, v)}); ui.claiming = null; saveMe(); break; }
    case "cancelclaim": ui.claiming = null; break;
    case "undo": delete me.q[id]; saveMe(); break;
    case "chk": { const c = mine(id); if(checking && c){ if(c.chk) delete c.chk; else c.chk = today(); saveMe(); } break; }
    case "lockcheck": checking = false; break;
    case "mkcode": ui.code = backupCode(); break;
    case "showrestore": ui.restore = !ui.restore; break;
    case "copy": { const ta = $("#" + el.dataset.t); const ok = () => { el.textContent = "Copied"; }; const fb = () => { ta.focus(); ta.select(); try { document.execCommand("copy"); ok(); } catch(e){ el.textContent = "Select the text and copy it"; } };
      try { navigator.clipboard.writeText(ta.value).then(ok, fb); } catch(e){ fb(); } return; }
    /* teacher */
    case "tsub": ui.tsub = el.dataset.k; ui.edit = null; break;
    case "locktab": unlocked = false; if(me.cls === "*") me.cls = ""; break;
    case "edit": ui.edit = id || null; break;
    case "pin": { const i = T.spotlight.indexOf(id); if(i >= 0) T.spotlight.splice(i,1); else T.spotlight.push(id); saveT(); break; }
    case "hide": { const it = item(id); if(it.hidden) delete it.hidden; else it.hidden = true; saveT(); break; }
    case "delclass": T.classes = T.classes.filter(c => c.id !== id); saveT(); break;
    case "delres": T.resources = T.resources.filter(r => r.id !== id); saveT(); break;
    case "newyear": T.classes.forEach(c => { c.name = nextYear(c.name); c.open = DEFAULT_OPEN.slice(); c.now = ""; }); saveT(); ui.flash = "Class names moved on a year and topics reset. Publish data.js so students see it."; break;
    case "loadpub": T = clone(PUB); store.set(KEY_T, T); ui.flash = "Loaded the published file."; break;
  }
  render();
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target.dataset.form, v = id => ($("#" + id).value || "").trim();
  if(f === "pin"){ if(hash(v("pin")) === PUB.settings.pinHash || (T && hash(v("pin")) === T.settings.pinHash)){ unlocked = true; if(!T){ T = clone(PUB); store.set(KEY_T, T); } } else ui.flash = "That PIN isn't right."; }
  if(f === "checkpin"){ if(hash(v("cpin")) === PUB.settings.pinHash) checking = true; else ui.flash = "That PIN isn't right."; }
  if(f === "restore"){ const o = readBackup(v("codein")); if(o){ me = Object.assign({cls:"", clsName:"", q:{}, rung:0}, o); saveMe(); ui.restore = false; ui.flash = "Progress restored."; } else ui.flash = "That doesn't look like a backup code. It should start with MC1."; }
  if(f === "addclass"){ const n = v("nc"); let id = slug(n), k = 2; while(cls(id)) id = slug(n) + "-" + k++; T.classes.push({id, name:n, open:DEFAULT_OPEN.slice(), now:""}); saveT(); }
  if(f === "addtopic"){ const n = v("nt"); let id = slug(n), k = 2; while(T.topics.some(t => t.id === id)) id = slug(n) + "-" + k++; T.topics.push({id, name:n}); saveT(); }
  if(f === "addres"){ const n = v("r_name"); let id = slug(n), k = 2; while(T.resources.some(r => r.id === id)) id = slug(n) + "-" + k++; T.resources.push(normRes({id, name:n, url:v("r_url"), kind:v("r_kind"), status:v("r_status"), note:v("r_note")})); saveT(); }
  if(f === "settings"){ Object.assign(T.settings, {title:v("s_title") || "Maths Challenges", teacher:v("s_teacher") || "your teacher", nudge:$("#s_nudge").checked}); if(v("s_pin")) T.settings.pinHash = hash(v("s_pin")); saveT(); ui.flash = "Setup saved. Publish data.js so students see it" + (v("s_pin") ? "; the new PIN works on other devices once it is published." : "."); }
  if(f === "quest"){
    const isNewQ = ui.edit === "new", old = isNewQ ? null : item(ui.edit);
    let id = old ? old.id : slug(v("f_title")); if(isNewQ){ let n = 2, base = id; while(item(id)) id = base + "-" + n++; }
    const q = norm({id, title:v("f_title"), url:v("f_url"), dir:v("f_dir"), topic:v("f_topic"), pts:+v("f_pts"), src:v("f_src"), paper:$("#f_paper").checked, blurb:v("f_blurb"), how:v("f_how"),
      record:v("f_rec") ? {label:v("f_rec"), best:v("f_best")} : null, rung:+v("f_rung") || 0, pass:v("f_pass"), added:old ? old.added : today(), hidden:old ? old.hidden : false}, T.topics);
    const i = T.quests.findIndex(x => x.id === q.id); if(i >= 0) T.quests[i] = q; else T.quests.push(q);
    saveT(); ui.edit = null; ui.flash = "Saved on this device. Publish data.js to share it.";
  }
  if(f === "import"){
    let arr = null; const txt = v("imp").replace(/,\s*$/, "");
    try { const o = JSON.parse(txt); arr = Array.isArray(o) ? o : [o]; } catch(e){ try { arr = JSON.parse("[" + txt + "]"); } catch(e2){
      try { arr = txt.split(/\n/).map(l => l.trim().replace(/,$/, "")).filter(Boolean).map(l => JSON.parse(l)); } catch(e3){ arr = null; } } }
    if(arr && arr.length && arr.every(o => o && (o.title || (o.name && o.status)))){
      let nq = 0, nr = 0;
      arr.forEach(o => {
        if(!o.title){ const r = normRes(o), i = T.resources.findIndex(x => x.id === r.id); if(i >= 0) T.resources[i] = r; else T.resources.push(r); nr++; return; }
        if(!o.added && !item(o.id || slug(o.title))) o.added = today();
        const q = norm(o, T.topics), i = T.quests.findIndex(x => x.id === q.id); if(i >= 0) T.quests[i] = q; else T.quests.push(q); nq++;
      });
      saveT(); ui.flash = "Imported " + nq + (nq === 1 ? " quest" : " quests") + (nr ? " and " + nr + (nr === 1 ? " resource" : " resources") : "") + ". Publish data.js to share them.";
    } else ui.flash = "Couldn't read that. Each line should look like {\"title\": \"…\", \"dir\": \"puzzle\", …}.";
  }
  render();
});
document.addEventListener("input", ev => { if(ev.target.id === "q"){ ui.q = ev.target.value; $("#grid").innerHTML = listHTML(); } });
document.addEventListener("change", ev => {
  const t = ev.target, ds = t.dataset;
  if(ds.rstage){ const sg = +t.value, c = mine(ds.rstage) || {};
    if(sg === 3) me.q[ds.rstage] = Object.assign(c, {s:"done", d:c.s === "done" ? c.d : today(), st:3});
    else if(sg === 0) delete me.q[ds.rstage];
    else me.q[ds.rstage] = Object.assign(c, {s:"try", st:sg}, c.s === "done" ? {d:today()} : {});
    saveMe(); render(); }
  else if(t.id === "setrung"){ if(checking){ me.rung = +t.value || 0; saveMe(); render(); } }
  else if(ds.open){ const [c, tp] = ds.open.split("|"), k = cls(c); if(t.checked){ if(!k.open.includes(tp)) k.open.push(tp); } else { k.open = k.open.filter(x => x !== tp); if(k.now === tp) k.now = ""; } saveT(); render(); }
  else if(ds.now){ cls(ds.now).now = t.value; saveT(); }
  else if(ds.cname){ const n = t.value.trim(); if(n){ cls(ds.cname).name = n; saveT(); } }
  else if(ds.rstat){ const r = T.resources.find(x => x.id === ds.rstat); r.status = t.value; saveT(); render(); }
});
route();
</script>
