<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maths Side Quests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a dark ink masthead with the tabs, then a quest log of cards with a coloured spine per kind. Marigold is reserved for points and this week's picks. */
:root{
  --paper:#f2f4f9; --card:#ffffff; --ink:#141b30; --muted:#566080; --line:#d7dcea;
  --mast:#141b30; --mast-ink:#f2f4f9; --mast-muted:#a9b2cc;
  --gold:#f2a900; --gold-ink:#3d2a00; --gold-soft:#fff3d1;
  --ok:#17794e; --ok-soft:#dcf3e7; --wait:#9a5b00; --wait-soft:#ffecc7; --bad:#b3261e;
  --k-level:#2b63d9; --k-puzzle:#6a45c4; --k-explore:#17794e; --k-play:#c82d68; --k-compete:#b86100; --k-create:#0b7f8c; --k-report:#5b6b00;
  --display:"Bricolage Grotesque","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0e1322; --card:#182036; --ink:#e9ecf6; --muted:#9aa4c2; --line:#2b3552;
    --mast:#090d18; --mast-ink:#f2f4f9; --mast-muted:#9aa4c2;
    --gold:#f5b829; --gold-ink:#2b1d00; --gold-soft:#3a2f10;
    --ok:#5fd19b; --ok-soft:#143526; --wait:#f0b64e; --wait-soft:#3a2c0d; --bad:#ff8a80;
    --k-level:#7ea6ff; --k-puzzle:#b095ff; --k-explore:#5fd19b; --k-play:#ff7fae; --k-compete:#f0a04e; --k-create:#5cc8d4; --k-report:#c3d65c;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0e1322; --card:#182036; --ink:#e9ecf6; --muted:#9aa4c2; --line:#2b3552;
  --mast:#090d18; --mast-ink:#f2f4f9; --mast-muted:#9aa4c2;
  --gold:#f5b829; --gold-ink:#2b1d00; --gold-soft:#3a2f10;
  --ok:#5fd19b; --ok-soft:#143526; --wait:#f0b64e; --wait-soft:#3a2c0d; --bad:#ff8a80;
  --k-level:#7ea6ff; --k-puzzle:#b095ff; --k-explore:#5fd19b; --k-play:#ff7fae; --k-compete:#f0a04e; --k-create:#5cc8d4; --k-report:#c3d65c;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-top:20px}
.mast h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;letter-spacing:-.01em}
.mast h1 span{color:var(--gold)}
.mast .brand{padding-bottom:14px}
.mast .sub{color:var(--mast-muted);font-size:.9rem;margin-top:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{display:block;padding:10px 14px;border-radius:var(--r) var(--r) 0 0;text-decoration:none;color:var(--mast-muted);font-weight:700}
.tabs a:hover{color:var(--mast-ink)}
.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink)}

main{padding:20px 0 48px}
.stack{display:flex;flex-direction:column;gap:20px}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;font-size:.95rem}
.note.plain{background:var(--card);border-color:var(--line)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.925rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding:7px 8px}
.btn.quiet:hover{color:var(--ink)}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;max-width:100%}
textarea{width:100%;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
label{font-weight:700;font-size:.875rem;display:flex;flex-direction:column;gap:4px}
label.inline{flex-direction:row;align-items:center;gap:6px;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

/* this week */
.week h2,.sect h2{font-size:1.25rem}
.week .head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .gap{flex:1 1 20px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.875rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--kc)}

.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--kc);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.card.pick{border-top:3px solid var(--gold)}
.k-level{--kc:var(--k-level)}.k-puzzle{--kc:var(--k-puzzle)}.k-explore{--kc:var(--k-explore)}.k-play{--kc:var(--k-play)}.k-compete{--kc:var(--k-compete)}.k-create{--kc:var(--k-create)}.k-report{--kc:var(--k-report)}
.card .top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:.8rem}
.kind{color:var(--kc);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tag{border-radius:5px;padding:1px 7px;font-weight:700;background:var(--paper);border:1px solid var(--line)}
.tag.new{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.tag.hid{background:var(--wait-soft);color:var(--wait);border-color:transparent}
.pts{margin-left:auto;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pips{color:var(--gold);letter-spacing:1px}
.card h3{font-size:1.15rem}
.card .blurb{font-size:.95rem}
.card .how{font-size:.875rem;color:var(--muted)}
.card .social{font-size:.875rem;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.card .social b{font-weight:700}
.unsolved{color:var(--k-play);font-weight:700}
.card .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:4px}
.status{font-size:.875rem;font-weight:700;border-radius:6px;padding:4px 8px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.wait{background:var(--wait-soft);color:var(--wait)}

/* boards */
.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel.wide{grid-column:1/-1}
.panel h2{font-size:1.15rem}
.panel .lede{font-size:.875rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:4px 8px}
td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.me td{background:var(--gold-soft);font-weight:700}
.rank{font-family:var(--display);font-weight:800;width:2.2em}
.bar{height:8px;border-radius:4px;background:var(--gold);min-width:3px}
.kd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:3px;background:var(--kc);opacity:.18}
.kd.on{opacity:1}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.list li{font-size:.95rem}
.rec{border-top:1px solid var(--line);padding-top:8px}
.rec:first-of-type{border-top:0;padding-top:0}
.rec .ttl{font-weight:700}
.rec ol{margin:4px 0 0;padding-left:1.4em}

/* teacher */
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.form .full{grid-column:1/-1}
.form input[type=text],.form select,.form textarea{width:100%}
.form textarea{font-family:var(--body);font-size:.95rem;min-height:64px}
.ticks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:4px 16px}
.ticks label{flex-direction:row;align-items:center;font-weight:400;gap:8px;font-size:.95rem;padding:3px 0}
.ticks input[type=number]{width:90px;padding:3px 6px}

/* topics */
.topic{display:flex;flex-direction:column;gap:10px}
.topic .th{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;border-bottom:2px solid var(--line);padding-bottom:6px}
.topic .th h3{font-size:1.15rem}
.classline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.cgrid td,.cgrid th{text-align:center;white-space:nowrap}
.cgrid td:first-child,.cgrid th:first-child{text-align:left;white-space:normal}
.cgrid input[type=text]{width:110px;text-align:center;font-weight:700}
/* ladder, reports, resources */
.rung .th h3{font-size:1.15rem}
.rung.locked .th h3{color:var(--muted)}
.rung.locked{opacity:.8}
.lock{font-size:.9rem;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.tier{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.875rem;color:var(--muted)}
.tier b{color:var(--ink)}
details.help{font-size:.875rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper)}
details.help summary{cursor:pointer;font-weight:700}
details.help ol{margin:6px 0;padding-left:1.3em;display:flex;flex-direction:column;gap:3px}
.res td{vertical-align:top}
.res td.rnote{min-width:220px;color:var(--muted);font-size:.875rem}
footer{color:var(--muted);font-size:.8rem;padding:0 0 32px}
@media (max-width:480px){.grid{grid-template-columns:1fr}.boards{grid-template-columns:1fr}.pts{margin-left:0}}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<header class="mast"><div class="wrap">
  <div class="brand"><h1 id="title"></h1><p class="sub" id="sub"></p></div>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Many of these quests come from Dylan Kane's <a href="https://fivetwelvethirteen.substack.com/p/glimpses" target="_blank" rel="noopener">Glimpses</a> list, Play With Your Math, Naoki Inaba, Transum and Math With Bad Drawings. Your own ticks stay on this device.</div></footer>

<script src="data.js"></script>
<script>
"use strict";
/* Maths Side Quests. Everything a teacher changes lives in data.js, written by the Teacher tab. */
const NEW_DAYS = 14, PICKS = 3;
const DIRS = {
  level:   {n:"Level up", d:"The site marks it for you. Earn the trophy. Start here in each topic."},
  puzzle:  {n:"Puzzle",   d:"One right answer, but nobody marks it for you. Stick with it."},
  explore: {n:"Explore",  d:"Open-ended. See how far you can take it."},
  play:    {n:"Play",     d:"A game against someone on the board."},
  create:  {n:"Create",   d:"Make something for other people to use."},
  report:  {n:"Report",   d:"Investigate a question and write it up. Agree a plan with your teacher before you start."},
  compete: {n:"Competition", d:"Real competition papers, one rung at a time."}
};
const DIR_ORDER = Object.keys(DIRS);
const QUEST_DIRS = DIR_ORDER.filter(k => k !== "compete");
const STAGES = ["Not started", "Plan agreed", "Draft seen", "Finished"];
const RKINDS = {site:"Website", papers:"Papers or printables", event:"Real competition", app:"App or game", data:"Data", book:"Book"};
const RSTAT = {find:"To find", add:"Found, to add", using:"In use"};
const TIER = {1:"Quick", 2:"Solid", 3:"Deep", 5:"Epic"};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
function iso(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function today(){ return iso(new Date()); }
function nice(d){ if(!d) return ""; const p = d.split("-"); return (+p[2]) + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]; }
function daysAgo(d){ return Math.round((new Date(today()) - new Date(d)) / 864e5); }
function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "x"; }
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function uid(p){ return p + Date.now().toString(36) + Math.floor(Math.random()*36).toString(36); }
function norm(it, topics){ // one fixed shape for a quest
  const o = {id:it.id || slug(it.title || "quest"), title:it.title || "Untitled", dir:DIRS[it.dir] ? it.dir : "puzzle", topic:topics.some(t => t.id === it.topic) ? it.topic : "any", pts:TIER[+it.pts] ? +it.pts : 2};
  if(it.url) o.url = it.url;
  if(it.src) o.src = it.src;
  if(it.paper) o.paper = true;
  o.blurb = it.blurb || ""; o.how = it.how || "";
  if(it.record && it.record.label) o.record = {label:it.record.label, best:it.record.best === "low" ? "low" : "high"};
  if(o.dir === "compete") o.rung = Math.max(0, Math.round(+it.rung || 0));
  if(it.pass != null && it.pass !== "" && !isNaN(+it.pass)) o.pass = +it.pass;
  if(it.added) o.added = it.added;
  if(it.hidden) o.hidden = true;
  return o;
}
function normRes(r){
  const o = {id:r.id || slug(r.name || "resource"), name:r.name || "Untitled"};
  if(r.url) o.url = r.url;
  o.kind = RKINDS[r.kind] ? r.kind : "site"; o.status = RSTAT[r.status] ? r.status : "add"; o.note = r.note || "";
  return o;
}
const DEFAULT_RUNGS = [{n:0, name:"Team rounds", d:"Get a team together. Open to everyone."}, {n:1, name:"First steps", d:"Short problems in competition style."}];
function fill(d){ // tolerate a hand-edited or older data file
  d = Object.assign({rev:0, published:"", topics:[], classes:[], spotlight:[], players:[], solves:{}, records:{}, reports:{}, matches:[], shouts:[], hall:[], rungs:[], resources:[], quests:[]}, d);
  if(!d.rungs.length) d.rungs = clone(DEFAULT_RUNGS);
  d.resources = d.resources.map(normRes);
  d.settings = Object.assign({title:"Maths Side Quests", teacher:"your teacher", pin:"6767", firstBonus:0, nudge:true}, d.settings);
  d.season = Object.assign({name:"Season 1", start:today()}, d.season);
  if(!d.topics.some(t => t.id === "any")) d.topics.unshift({id:"any", name:"Any time"});
  d.classes.forEach(c => { c.open = c.open || []; c.now = c.now || ""; });
  d.quests = d.quests.map(q => norm(q, d.topics));
  return d;
}

/* ---------- data ---------- */
const PUB = window.SQ_DATA ? fill(clone(window.SQ_DATA)) : null;
let me = Object.assign({name:"", cls:"", claims:{}}, store.get("mathsChallenges.me.v1", {}));
let T = PUB ? store.get("mathsChallenges.teacher.v1", null) : null;   // the teacher's working copy; only on a device that has unlocked the Teacher tab
if(T) T = fill(T);
let unlocked = false;
const ui = {view:"quests", dir:"all", q:"", todo:false, open:false, claiming:null, bcls:"", tsub:"mark", tStudent:"", edit:null, pending:null, flash:""};

function saveMe(){ store.set("mathsChallenges.me.v1", me); }
function saveT(){ T.rev = (T.rev||0) + 1; store.set("mathsChallenges.teacher.v1", T); }
const D = () => T || PUB;
const S = () => D().settings;
const dirty = () => T && T.rev !== PUB.rev;
const item = id => D().quests.find(x => x.id === id);
const topicName = id => (D().topics.find(t => t.id === id) || {name:id}).name;
const cls = id => D().classes.find(c => c.id === id);
const player = id => D().players.find(p => p.id === id);
const pn = id => { const p = player(id); return p ? p.n : "?"; };
function myPid(){ const n = me.name.trim().toLowerCase(); if(!n) return null; const p = D().players.find(p => p.n.toLowerCase() === n); return p ? p.id : null; }
function openTopics(cid){ if(cid === "*") return D().topics.map(t => t.id); const c = cls(cid); return ["any"].concat(c ? c.open : []); }
function visible(cid){ const o = openTopics(cid === undefined ? me.cls : cid); return D().quests.filter(q => !q.hidden && o.includes(q.topic)); }
function questList(){ return visible().filter(q => q.dir !== "compete"); }
function locked(){ const o = openTopics(me.cls); return D().quests.filter(q => !q.hidden && q.dir !== "compete" && !o.includes(q.topic)).length; }
function stageOf(pid, cid){ const r = (D().reports[cid] || []).find(x => x.p === pid); return r ? r.s : 0; }
function compQuests(n){ return D().quests.filter(q => q.dir === "compete" && !q.hidden && (q.rung || 0) === n); }
function passed(q){ // on the board, or claimed with the score the rung asks for
  if(myState(q.id) === "ok") return true;
  const c = me.claims[q.id]; if(!c || c.s !== "done") return false;
  return q.pass == null || (c.v != null && +c.v >= q.pass);
}
function rungDone(n){ return compQuests(n).some(passed); }
function ladder(){ return D().rungs.filter(r => r.n > 0).slice().sort((a,b) => a.n - b.n); }
function setRung(){ const p = player(myPid()); return p && p.rung ? p.rung : 0; } // a rung set by the teacher overrides the automatic ladder
function rungOpen(n){ if(T) return true; const fixed = setRung(); if(fixed) return n <= fixed; const L = ladder(), i = L.findIndex(r => r.n === n); return i <= 0 || rungDone(L[i-1].n); }
function solvers(cid){ return (D().solves[cid] || []).filter(s => player(s.p)); }
function recs(cid){ const it = item(cid); const lo = it && it.record && it.record.best === "low"; return (D().records[cid] || []).filter(r => player(r.p)).slice().sort((a,b) => (lo ? a.v-b.v : b.v-a.v) || (a.d < b.d ? -1 : 1)); }
function isNew(it){ return it.added && daysAgo(it.added) >= 0 && daysAgo(it.added) <= NEW_DAYS; }

function picks(){ // this week: pinned first, then an automatic choice that changes each Monday and leans to the class's current topic
  const vis = questList(), c = cls(me.cls), now = c ? c.now : "";
  const pinned = D().spotlight.map(id => vis.find(x => x.id === id)).filter(Boolean);
  const out = pinned.slice(0, PICKS);
  if(out.length < PICKS){
    const d = new Date(), week = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(1970,0,5)) / 6048e5);
    const r = rng(week * 7919);
    const pool = vis.filter(x => !out.includes(x)).map(x => ({x, k:r() + (solvers(x.id).length ? 1 : 0) - (now && x.topic === now ? 1.5 : 0)})).sort((a,b) => a.k - b.k).map(o => o.x);
    for(const x of pool){ if(out.length >= PICKS) break; if(!out.some(o => o.dir === x.dir)) out.push(x); }
    for(const x of pool){ if(out.length >= PICKS) break; if(!out.includes(x)) out.push(x); }
  }
  return {list:out, auto:pinned.length === 0};
}
function stats(){
  const b = D(), start = b.season.start || "", by = {};
  b.players.forEach(p => by[p.id] = {p, pts:0, n:0, dirs:{}, firsts:0, w:0, l:0});
  for(const cid in b.solves){
    const arr = solvers(cid), it = item(cid);

  const ids = Object.keys(me.claims), waiting = ids.filter(id => me.claims[id].s === "done" && myState(id) !== "ok" && item(id)), trying = ids.filter(id => me.claims[id].s === "try" && myState(id) !== "ok" && item(id));
  const onBoard = pid ? b.quests.filter(it => solvers(it.id).some(s => s.p === pid)) : [];
  let h = '<div class="stack"><section class="panel"><h2>Who are you?</h2><div class="row"><label>Name on the board<input type="text" id="myname" list="names" value="' + esc(me.name) + '" autocomplete="off"></label><datalist id="names">' + b.players.map(p => '<option value="' + esc(p.n) + '">').join("") + "</datalist>" +
    '<label>Class<select id="mycls"><option value="">Choose</option>' + b.classes.map(c => '<option value="' + c.id + '"' + (me.cls === c.id ? " selected" : "") + ">" + esc(c.name) + "</option>").join("") + '</select></label><button class="btn primary" data-act="saveme">Save</button></div>' +
    '<p class="small muted">' + (pid ? "You are on the board." + (mineRow ? " " + esc(b.season.name) + ": " + mineRow.pts + " points, rank " + mineRow.rank + "." : "") : me.name ? "You are not on the board yet. Your first checked quest puts you there." : "Use the same name every time so your quests line up with the board.") + "</p></section>";
  h += '<section class="panel"><h2>Waiting to be checked</h2>';
  if(waiting.length){
    h += '<ul class="list">' + waiting.map(id => "<li><b>" + esc(item(id).title) + "</b>" + (me.claims[id].v != null ? " (" + esc(me.claims[id].v) + ")" : "") + ' <span class="muted small">claimed ' + nice(me.claims[id].d) + ". " + esc(item(id).how) + "</span></li>").join("") + "</ul>";
    h += '<p class="small">Show ' + T_ + " in class, or send your claims as a code.</p>";
    h += me.name.trim() ? '<div class="row"><button class="btn gold" data-act="mkcode">Make my claim code</button></div>' : '<p class="small muted">Save your name first.</p>';
    if(ui.code) h += '<textarea id="codeout" readonly aria-label="Claim code">' + esc(ui.code) + '</textarea><div class="row"><button class="btn primary" data-act="copy" data-t="codeout">Copy</button><span class="small muted">Paste it into a message to ' + T_ + ".</span></div>";
  } else h += '<p class="muted small">Nothing waiting. Press "Done it" on a quest when you finish one.</p>';
  h += "</section>";
  const myReps = pid ? b.quests.filter(q => q.dir === "report" && stageOf(pid, q.id) > 0 && stageOf(pid, q.id) < 3) : [];
  if(myReps.length) h += '<section class="panel"><h2>My report</h2><ul class="list">' + myReps.map(q => "<li><b>" + esc(q.title) + '</b> <span class="status wait">' + STAGES[stageOf(pid, q.id)] + "</span></li>").join("") + "</ul></section>";
  h += '<section class="panel"><h2>On my list</h2>' + (trying.length ? '<div class="grid">' + trying.map(id => cardHTML(item(id))).join("") + "</div>" : '<p class="muted small">Add quests to your list to find them again here.</p>') + "</section>";
  h += '<section class="panel"><h2>On the board</h2>' + (onBoard.length ? '<ul class="list">' + onBoard.map(it => "<li>" + esc(it.title) + ' <span class="muted small">' + DIRS[it.dir].n + " · " + it.pts + " points</span></li>").join("") + "</ul>" : '<p class="muted small">Nothing yet.</p>') + "</section></div>";
  return h;
}

function cOpts(sel){ return D().classes.map(c => '<option value="' + c.id + '"' + (c.id === sel ? " selected" : "") + ">" + esc(c.name) + "</option>").join(""); }

  let h = '<div class="stack"><div class="subtabs">' + Object.keys(subs).map(k => '<button class="btn' + (ui.tsub === k ? " on" : "") + '" data-act="tsub" data-k="' + k + '">' + subs[k] + "</button>").join("") + "</div>";

function tMark(){
  let h = '<section class="panel"><h2>Paste a claim code</h2><p class="lede">Students make these on their My log tab. Nothing counts until you approve it here.</p><form data-form="code" class="stack"><textarea id="codein" aria-label="Claim code" placeholder="SQ1. …"></textarea><div class="row"><button class="btn primary">Read code</button></div></form>';
  if(ui.pending){
    const P = ui.pending, pl = T.players.find(p => p.n.toLowerCase() === P.n.toLowerCase());
    h += '<div class="stack"><p><b>' + esc(P.n) + "</b>" + (cls(P.k) ? " (" + esc(cls(P.k).name) + ")" : "") + (pl ? "" : ' is not on the board yet. <button class="btn" data-act="addfromcode">Add ' + esc(P.n) + "</button>") + "</p>";
    if(pl){
      const todo = P.c.filter(c => item(c[0]) && !solvers(c[0]).some(s => s.p === pl.id));
      h += todo.length ? '<ul class="list">' + todo.map(c => "<li><b>" + esc(item(c[0]).title) + "</b>" + (c[1] != null ? " · " + esc(item(c[0]).record ? item(c[0]).record.label : "value") + " " + esc(c[1]) : "") + ' <span class="muted small">claimed ' + nice(c[2]) + '</span> <button class="btn" data-act="approve" data-id="' + c[0] + '">Approve</button></li>').join("") + '</ul><div class="row"><button class="btn gold" data-act="approveall">Approve all</button><button class="btn quiet" data-act="clearpending">Done</button></div>' : '<p class="muted small">Nothing left to approve. <button class="btn quiet" data-act="clearpending">Close</button></p>';
    }

  }
  h += '</section><section class="panel"><h2>Tick off by student</h2>';
  if(!T.players.length) return h + '<p class="muted small">Add students first, under Students and season.</p></section>';
  h += '<div class="row"><label>Student<select id="tstudent"><option value="">Choose</option>' + pOpts(ui.tStudent) + "</select></label></div>";
  const p = player(ui.tStudent);
  if(p){
    const o = openTopics(p.c), qs = T.quests.filter(it => o.includes(it.topic) || it.dir === "compete" || solvers(it.id).some(s => s.p === p.id));

      if(!g.length) return;
      h += '<div><b class="small">' + esc(t.name) + '</b><div class="ticks">' + g.map(it => {
        const s = solvers(it.id).find(s => s.p === p.id), r = (T.records[it.id]||[]).find(r => r.p === p.id);
        if(it.dir === "report"){ const sg = stageOf(p.id, it.id); return '<label><span>' + esc(it.title) + ' <span class="muted small">Report · ' + it.pts + "</span></span>" + '<select data-stage="' + it.id + '" aria-label="Stage for ' + esc(it.title) + '">' + STAGES.map((n, i) => '<option value="' + i + '"' + (sg === i ? " selected" : "") + ">" + n + "</option>").join("") + "</select></label>"; }
        return '<label><input type="checkbox" data-tick="' + it.id + '"' + (s ? " checked" : "") + "> <span>" + esc(it.title) + ' <span class="muted small">' + DIRS[it.dir].n + " · " + it.pts + (s ? " · " + nice(s.d) : "") + "</span></span>" + (it.record ? '<input type="number" step="any" data-rec="' + it.id + '" value="' + (r ? esc(r.v) : "") + '" placeholder="score" title="' + esc(it.record.label) + '" aria-label="' + esc(it.record.label) + '">' : "") + "</label>";

function tResources(){
  const R = T.resources, cnt = r => T.quests.filter(q => q.src && (q.src === r.name || (r.url && q.url && q.url.split("/")[2] === r.url.split("/")[2]))).length;

  h += '<form data-form="addres" class="form"><label>Name<input type="text" id="r_name" required></label><label>Link (optional)<input type="text" id="r_url" placeholder="https://"></label><label>Kind<select id="r_kind">' + Object.keys(RKINDS).map(k => '<option value="' + k + '">' + RKINDS[k] + "</option>").join("") + '</select></label><label>Status<select id="r_status">' + Object.keys(RSTAT).map(k => '<option value="' + k + '">' + RSTAT[k] + "</option>").join("") + '</select></label><label class="full">Note<input type="text" id="r_note" placeholder="What it is, and what still needs doing"></label><div><button class="btn primary">Add resource</button></div></form></section>';

    rs.forEach(r => { h += "<tr><td>" + (r.url ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.name) + "</a>" : esc(r.name)) + '</td><td class="small">' + RKINDS[r.kind] + "</td>" + (st === "using" ? '<td class="num">' + (r.kind === "event" ? "" : cnt(r)) + "</td>" : "") + '<td class="rnote">' + esc(r.note) + '</td><td><select data-rstat="' + r.id + '" aria-label="Status of ' + esc(r.name) + '">' + Object.keys(RSTAT).map(k => '<option value="' + k + '"' + (r.status === k ? " selected" : "") + ">" + RSTAT[k] + "</option>").join("") + '</select></td><td><button class="btn quiet danger" data-act="delres" data-id="' + r.id + '" data-confirm="1">Remove</button></td></tr>'; });

function tPublish(){
  const s = T.settings;
  let h = '<section class="panel"><h2>Setup</h2><form data-form="settings" class="form"><label>Page title<input type="text" id="s_title" value="' + esc(s.title) + '"></label><label>What students call you<input type="text" id="s_teacher" value="' + esc(s.teacher) + '"></label><label>Teacher PIN<input type="text" id="s_pin" inputmode="numeric" value="' + esc(s.pin) + '"></label><label>Bonus points for being first<input type="number" id="s_bonus" min="0" max="5" value="' + (+s.firstBonus||0) + '"></label><label class="inline full"><input type="checkbox" id="s_nudge"' + (s.nudge ? " checked" : "") + '> Remind students to start each topic with a Level up quest</label><div><button class="btn primary">Save setup</button></div></form></section>';
  h += '<section class="panel"><h2>Publish</h2><p class="lede">Students see whatever is in <b>data.js</b> next to the page. On GitHub: open data.js, press the pencil, select everything, paste, then Commit changes. The page updates within a few minutes.</p><div><span class="small ' + (dirty() ? "" : "muted") + '">' + (dirty() ? "Changed on this device since the published copy." : "Matches the published copy.") + '</span></div><textarea id="out_data" readonly aria-label="data.js">' + esc(dataFile(T, "Written by the Teacher tab on")) + '</textarea><div class="row"><button class="btn primary" data-act="copy" data-t="out_data">Copy data.js</button></div></section>';
  h += '<section class="panel"><h2>This device</h2><p class="lede">Your working copy lives in this browser. The published data.js is also your backup: on a new device, unlock this tab and it starts from the published copy.</p><div class="row"><button class="btn" data-act="loadpub" data-confirm="1">Throw away my changes and reload the published file</button></div></section>';
  h += '<section class="panel"><h2>Share with another teacher</h2><p class="lede">A clean data.js with your quests and topics but no students, scores or name. Give them this and index.html.</p><textarea id="out_start" readonly aria-label="Starter data.js">' + esc(dataFile(starter(), "Starter copy made on")) + '</textarea><div class="row"><button class="btn" data-act="copy" data-t="out_start">Copy starter data.js</button></div></section>';
  return h;
}

/* ---------- render and events ---------- */
function render(){
  if(!PUB){ $("#title").textContent = "Maths Side Quests"; $("#app").innerHTML = '<p class="note">The quests didn\'t load. Check that <b>data.js</b> is in the same folder as this page.</p>'; return; }
  const b = D();
  document.title = S().title;
  $("#title").innerHTML = esc(S().title).replace(/(\S+)$/, "<span>$1</span>");
  $("#sub").textContent = b.season.name + (b.published ? " · board updated " + nice(b.published) : "");
  const tabs = {quests:"Quests", compete:"Competitions", boards:"Boards", mine:"My log", teacher:"Teacher"};
  $("#tabs").innerHTML = Object.keys(tabs).map(k => '<a href="#' + k + '"' + (ui.view === k ? ' aria-current="page"' : "") + ">" + tabs[k] + "</a>").join("");
  $("#app").innerHTML = ({quests:viewQuests, compete:viewCompete, boards:viewBoards, mine:viewMine, teacher:viewTeacher})[ui.view]();
  ui.flash = "";
}
function route(){ const v = location.hash.replace("#",""); ui.view = ["quests","compete","boards","mine","teacher"].includes(v) ? v : "quests"; render(); }
window.addEventListener("hashchange", route);

let armed = null;
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if(el.dataset.confirm && armed !== el){ armed = el; el.dataset.label = el.textContent; el.textContent = "Sure? Press again"; setTimeout(() => { if(armed === el){ armed = null; if(el.isConnected) el.textContent = el.dataset.label; } }, 4000); return; }
  armed = null;
  switch(act){
    case "dir": ui.dir = el.dataset.k; break;
    case "toggle": ui[el.dataset.f] = !ui[el.dataset.f]; break;
    case "bcls": ui.bcls = id; break;
    case "pickcls": me.cls = id; saveMe(); break;
    case "showopen": ui.open = true; ui.dir = "all"; ui.q = ""; location.hash = "quests"; break;
    case "surprise": { ui.q = ""; const pool = filtered().filter(it => !myState(it.id)); if(pool.length) ui.q = pool[Math.floor(Math.random()*pool.length)].title; break; }
    case "try": { const c = me.claims[id]; if(c && c.s === "try") delete me.claims[id]; else me.claims[id] = {s:"try", d:today()}; saveMe(); break; }
    case "done": { if(item(id).record) ui.claiming = id; else { me.claims[id] = {s:"done", d:today()}; saveMe(); } break; }
    case "claim": { const v = el.closest(".card").querySelector("input[type=number]").value; me.claims[id] = {s:"done", d:today(), v: v === "" ? null : +v}; ui.claiming = null; saveMe(); break; }
    case "cancelclaim": ui.claiming = null; break;
    case "unclaim": delete me.claims[id]; saveMe(); break;
    case "saveme": me.name = $("#myname").value.trim(); me.cls = $("#mycls").value; saveMe(); ui.code = ""; break;
    case "mkcode": ui.code = claimCode(); break;
    case "copy": { const ta = $("#" + el.dataset.t); const done = () => { el.textContent = "Copied"; }; const fb = () => { ta.focus(); ta.select(); try { document.execCommand("copy"); done(); } catch(e){ el.textContent = "Select the text and copy it"; } };
      try { navigator.clipboard.writeText(ta.value).then(done, fb); } catch(e){ fb(); } return; }
    /* teacher */
    case "tsub": ui.tsub = el.dataset.k; ui.edit = null; break;
    case "addfromcode": T.players.push({id:uid("p"), n:ui.pending.n, c:cls(ui.pending.k) ? ui.pending.k : (T.classes[0]||{id:""}).id}); saveT(); break;
    case "approve": case "approveall": { const P = ui.pending, pl = T.players.find(p => p.n.toLowerCase() === P.n.toLowerCase());
      P.c.filter(c => act === "approveall" || c[0] === id).forEach(c => addSolve(pl.id, c[0], c[2], c[1])); saveT(); break; }
    case "clearpending": ui.pending = null; break;
    case "delmatch": T.matches.splice(+el.dataset.i, 1); saveT(); break;
    case "delshout": T.shouts.splice(+el.dataset.i, 1); saveT(); break;
    case "edit": ui.edit = id || null; break;
    case "pin": { const i = T.spotlight.indexOf(id); if(i >= 0) T.spotlight.splice(i,1); else T.spotlight.push(id); saveT(); break; }
    case "hide": { const it = item(id); if(it.hidden) delete it.hidden; else it.hidden = true; saveT(); break; }
    case "delclass": T.classes = T.classes.filter(c => c.id !== id); saveT(); break;
    case "delres": T.resources = T.resources.filter(r => r.id !== id); saveT(); break;
    case "delplayer": { T.players = T.players.filter(p => p.id !== id); for(const k of ["solves","records","reports"]) for(const c in T[k]){ T[k][c] = T[k][c].filter(s => s.p !== id); if(!T[k][c].length) delete T[k][c]; } T.matches = T.matches.filter(m => m.w !== id && m.l !== id); T.shouts = T.shouts.filter(s => s.p !== id); if(ui.tStudent === id) ui.tStudent = ""; saveT(); break; }
    case "cleardemo": T.players = []; T.solves = {}; T.records = {}; T.reports = {}; T.matches = []; T.shouts = []; T.hall = []; delete T.demo; ui.tStudent = ""; saveT(); break;
    case "newseason": { const top = ranked(stats(), r => r.pts).filter(r => r.pts > 0).slice(0,3).map(r => ({n:r.p.n, pts:r.pts})); if(top.length) T.hall.push({name:T.season.name, top}); T.season = {name:"New season", start:today()}; saveT(); ui.flash = "New season started. Give it a name."; break; }
    case "loadpub": T = clone(PUB); store.set("mathsChallenges.teacher.v1", T); ui.tStudent = ""; ui.pending = null; ui.flash = "Loaded the published file."; break;
  }
  render();
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target.dataset.form, v = id => ($("#" + id).value || "").trim();
  if(f === "pin"){ if(v("pin") === String(S().pin)){ unlocked = true; if(!T){ T = clone(PUB); store.set("mathsChallenges.teacher.v1", T); } } else ui.flash = "That PIN isn't right."; }
  if(f === "code"){ const o = readCode(v("codein")); if(o && o.n) ui.pending = o; else ui.flash = "That doesn't look like a claim code. It should start with SQ1."; }
  if(f === "match"){ const w = v("mw"), l = v("ml"); if(w && l && w !== l){ T.matches.push({c:v("mgame"), w, l, d:today()}); saveT(); } else ui.flash = "Pick two different students."; }
  if(f === "shout"){ if(v("sp") && v("st")){ T.shouts.push({p:v("sp"), t:v("st"), d:today()}); saveT(); } }
  if(f === "player"){ const n = v("np"); if(n && !T.players.some(p => p.n.toLowerCase() === n.toLowerCase())){ T.players.push({id:uid("p"), n, c:v("nk")}); saveT(); } else ui.flash = "That name is already on the board."; }
  if(f === "season"){ T.season = {name:v("sn") || "Season", start:v("ss") || today()}; saveT(); ui.flash = "Season saved."; }
  if(f === "addclass"){ const n = v("nc"); let id = slug(n), k = 2; while(cls(id)) id = slug(n) + "-" + k++; T.classes.push({id, name:n, open:[], now:""}); saveT(); }
  if(f === "addtopic"){ const n = v("nt"); let id = slug(n), k = 2; while(T.topics.some(t => t.id === id)) id = slug(n) + "-" + k++; T.topics.push({id, name:n}); saveT(); }
  if(f === "settings"){ Object.assign(T.settings, {title:v("s_title") || "Maths Side Quests", teacher:v("s_teacher") || "your teacher", pin:v("s_pin") || "6767", firstBonus:+v("s_bonus") || 0, nudge:$("#s_nudge").checked}); saveT(); ui.flash = "Setup saved. Publish data.js so students see it."; }
  if(f === "quest"){
    const isNewQ = ui.edit === "new", old = isNewQ ? null : item(ui.edit);
    let id = old ? old.id : slug(v("f_title")); if(isNewQ){ let n = 2, base = id; while(item(id)) id = base + "-" + n++; }
    putQuest({id, title:v("f_title"), url:v("f_url"), dir:v("f_dir"), topic:v("f_topic"), pts:+v("f_pts"), src:v("f_src"), paper:$("#f_paper").checked, blurb:v("f_blurb"), how:v("f_how"),
      record:v("f_rec") ? {label:v("f_rec"), best:v("f_best")} : null, rung:+v("f_rung") || 0, pass:v("f_pass"), added:old ? old.added : today(), hidden:old ? old.hidden : false});
    saveT(); ui.edit = null; ui.flash = "Saved on this device. Publish data.js to share it.";
  }
  if(f === "addres"){ const n = v("r_name"); let id = slug(n), k = 2; while(T.resources.some(r => r.id === id)) id = slug(n) + "-" + k++; T.resources.push(normRes({id, name:n, url:v("r_url"), kind:v("r_kind"), status:v("r_status"), note:v("r_note")})); saveT(); }
  if(f === "import"){
    let arr = null; const txt = v("imp").replace(/,\s*$/, "");
    try { const o = JSON.parse(txt); arr = Array.isArray(o) ? o : [o]; } catch(e){ try { arr = JSON.parse("[" + txt + "]"); } catch(e2){
      try { arr = txt.split(/\n/).map(l => l.trim().replace(/,$/, "")).filter(Boolean).map(l => JSON.parse(l)); } catch(e3){ arr = null; } } }
    if(arr && arr.length && arr.every(o => o && (o.title || (o.name && o.status)))){
      let nq = 0, nr = 0;
      arr.forEach(o => {
        if(!o.title){ const r = normRes(o), i = T.resources.findIndex(x => x.id === r.id); if(i >= 0) T.resources[i] = r; else T.resources.push(r); nr++; return; }
        if(!o.added && !item(o.id || slug(o.title))) o.added = today(); putQuest(o); nq++;
      });
      saveT(); ui.flash = "Imported " + nq + (nq === 1 ? " quest" : " quests") + (nr ? " and " + nr + (nr === 1 ? " resource" : " resources") : "") + ". Publish data.js to share them.";
    }
    else ui.flash = "Couldn't read that. Each quest should look like {\"title\": \"…\", \"dir\": \"puzzle\", …}, one per line.";
  }
  render();
});
document.addEventListener("input", ev => { if(ev.target.id === "q"){ ui.q = ev.target.value; $("#grid").innerHTML = listHTML(); } });
document.addEventListener("change", ev => {
  const t = ev.target, ds = t.dataset;
  if(t.id === "tstudent"){ ui.tStudent = t.value; render(); }
  else if(ds.tick){ if(t.checked) addSolve(ui.tStudent, ds.tick, today()); else removeSolve(ui.tStudent, ds.tick); saveT(); render(); }
  else if(ds.rec){ setRecord(ui.tStudent, ds.rec, t.value === "" ? NaN : +t.value, today()); saveT(); }
  else if(ds.open){ const [c, tp] = ds.open.split("|"), k = cls(c); if(t.checked) k.open.push(tp); else { k.open = k.open.filter(x => x !== tp); if(k.now === tp) k.now = ""; } saveT(); render(); }
  else if(ds.now){ cls(ds.now).now = t.value; saveT(); }
  else if(ds.cname){ const n = t.value.trim(); if(n){ cls(ds.cname).name = n; saveT(); } }
  else if(ds.pcls){ player(ds.pcls).c = t.value; saveT(); }
  else if(ds.prung){ const p = player(ds.prung); if(+t.value) p.rung = +t.value; else delete p.rung; saveT(); }
  else if(ds.stage){ const sg = +t.value, cid = ds.stage, pid = ui.tStudent, arr = T.reports[cid] = (T.reports[cid] || []).filter(x => x.p !== pid);
    if(sg > 0) arr.push({p:pid, s:sg, d:today()}); if(!arr.length) delete T.reports[cid];
    if(sg === 3) addSolve(pid, cid, today()); else removeSolve(pid, cid); saveT(); render(); }
  else if(ds.rstat){ const r = T.resources.find(x => x.id === ds.rstat); r.status = t.value; saveT(); render(); }
});
route();
</script>
