<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Maths Games</title>
<style>
:root{--bg:#f4f2ec;--panel:#fff;--ink:#1c2230;--muted:#646c7a;--line:#dedad0;--accent:#274c77;--accent-ink:#fff;
--k:#3d7a5a;--n:#2f6f8f;--f:#8a5a9e;--w:#b4682a;--ok:#2f8a53;--warn:#b97a14;--bad:#c2482f;--soft:#eef2f7;--gold:#c99a1d;
--font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15181e;--panel:#1f242d;--ink:#eceef2;--muted:#9aa3b2;--line:#343b48;--accent:#7fb0e6;--accent-ink:#0f1620;--soft:#262d39;--k:#7cc79c;--n:#6bb3d6;--f:#c29ad6;--w:#e3a063;--ok:#5cc487;--warn:#e6b455;--bad:#ef8a73}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
main{max-width:760px;margin:0 auto;padding:14px 16px 70px}
h1{font-size:24px;margin:6px 0 4px}h2{font-size:19px;margin:18px 0 8px}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{font-size:19px;padding:13px 22px}.btn.ghost{background:transparent}.btn.sm{min-height:34px;padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.homelink{display:inline-block;margin:4px 12px 2px 0;color:var(--muted);font-size:14px;text-decoration:none}.homelink:hover{text-decoration:underline}
.top{display:flex;align-items:center;gap:10px;margin:0 -16px 4px;padding:8px 16px;position:sticky;top:0;z-index:10;background:var(--bg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;min-height:38px}
.seg button.on{background:var(--ink);color:var(--bg)}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:13px;font-weight:600;background:var(--soft)}
.game{border-left:6px solid var(--c)}
.game.soon{opacity:.75}
.tick{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;min-height:40px;cursor:pointer;font-weight:600}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tick.sm{min-height:34px;padding:3px 10px;font-size:14px;font-weight:500}
.fams{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.qbig{font-size:38px;font-weight:700;text-align:center;margin:18px 0 10px;line-height:1.3}
.box{display:inline-block;width:1.3em;height:1.15em;border:.08em solid currentColor;border-radius:.2em;vertical-align:middle;opacity:.65}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;max-width:420px;margin-left:auto;margin-right:auto}
.pad button{font-size:22px;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;min-height:50px;touch-action:manipulation}
.fb{min-height:30px;text-align:center;font-weight:600;margin:8px 0}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}.fb.warn{color:var(--warn)}
.rcv{display:block;width:100%;max-width:720px;margin:6px auto 0;image-rendering:crisp-edges;image-rendering:pixelated;border:1px solid var(--line);border-radius:10px}
.rkey{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.rtab{border-collapse:collapse;width:100%}.rtab th{text-align:left;font-size:13px;color:var(--muted);padding:6px}.rtab td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:top}
.rv{max-width:420px;margin:0 auto;font-size:28px;text-align:center;padding:8px;min-height:56px;border:2px solid var(--line);border-radius:12px;background:var(--panel)}
.pad button.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:600}.pad button:disabled{opacity:.45}
.afig{max-width:440px;margin:2px auto 0}
svg.ang{display:block;width:100%;height:auto;max-height:var(--mh,40vh);margin:0 auto;overflow:visible}
.ang path,.ang circle{vector-effect:non-scaling-stroke}
.ang .arm{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round}.ang .marc{stroke:var(--ink);stroke-width:2;fill:none}.ang .avx{fill:var(--ink)}
.ang .aguess{stroke:var(--w);stroke-width:3;stroke-dasharray:7 6;fill:none;stroke-linecap:round}
.ang .prot{opacity:0;transition:opacity .35s}.ang .prot.on{opacity:1}
.ang .pbody{fill:var(--accent);fill-opacity:.07;stroke:var(--accent);stroke-width:1.5}.ang .ptick{stroke:var(--accent);stroke-width:1}
.ang .plab{fill:var(--accent);font-size:8px;text-anchor:middle;dominant-baseline:central;font-family:var(--font)}
.ang .asw{fill:var(--accent);fill-opacity:.2}
.ang .alab{fill:var(--accent);font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-family:var(--font);opacity:0;transition:opacity .3s}.ang .alab.on{opacity:1}
.aq{font-size:19px;font-weight:600;margin:8px 0 6px}
.fbband{font-size:19px;margin:4px 0}.band{display:inline-block;padding:1px 9px;border-radius:99px;background:var(--soft);font-size:14px;font-weight:600;margin-left:8px}
.glist{max-width:420px;margin:6px auto}.grow{display:flex;align-items:center;gap:6px;padding:2px;min-height:30px;border-bottom:1px solid var(--line)}.gn{color:var(--muted);font-size:13px;width:16px}
.share{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px auto;max-width:520px}.share code{font-family:var(--font);font-size:14px;background:var(--soft);padding:6px 10px;border-radius:8px;word-break:break-word}
.emrow{font-size:19px;letter-spacing:1px;margin:4px 0}
.ttl{font-size:16px;line-height:1.25}.top .chip{white-space:nowrap}.acc{color:var(--accent)}
.rkey.dash{background:none;border-top:2px dashed var(--w);height:0;border-radius:0;width:14px}
table.stats{border-collapse:collapse;margin:4px 0}table.stats td,table.stats th{padding:3px 10px 3px 0;text-align:left}table.stats th{color:var(--muted);font-weight:600}
.seg.tiers{display:flex}.seg.tiers button{flex:1 1 0;padding:7px 4px}
.card.ask{border-color:var(--warn)}
</style>
</head>
<body>
<main id="app"></main>
<!-- ===== extension log: shared by every page (SI-1, 24 Nov 2026). Keep this block identical in index.html, practice/, challenges/ and games/ (records-tests.py checks). ===== -->
<style>
.xl{--xl-bg:#fff;--xl-ink:#1c2230;--xl-muted:#5d6574;--xl-line:#d9dce4;--xl-soft:#f1f3f8;--xl-acc:#274c77;--xl-acc-ink:#fff;--xl-gold:#e9b949;--xl-gold-ink:#2b2100;
  font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.45;color:var(--xl-ink)}
@media (prefers-color-scheme:dark){.xl{--xl-bg:#1f242d;--xl-ink:#eceef2;--xl-muted:#a3abb9;--xl-line:#3a4250;--xl-soft:#283040;--xl-acc:#8bb8ea;--xl-acc-ink:#0f1620;--xl-gold:#f0c55b;--xl-gold-ink:#2b2100}}
.xl *{box-sizing:border-box}
.xl-ov{position:fixed;inset:0;background:rgba(10,14,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:16px 10px;overflow-y:auto;z-index:1000}
.xl-dlg:focus{outline:none}
.xl-dlg{background:var(--xl-bg);border-radius:14px;border-top:5px solid var(--xl-gold);width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:12px;margin:auto 0;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.xl-dlg h2{font-size:20px;margin:0;line-height:1.25}
.xl-m{color:var(--xl-muted);font-size:14px;margin:0}
.xl-dlg p{margin:0}
.xl-lab{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:15px}
.xl-lab span.xl-m{font-weight:400}
.xl input[type=text],.xl input[type=number]{font:inherit;color:var(--xl-ink);background:var(--xl-bg);border:1.5px solid var(--xl-line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
.xl-btn{font:inherit;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--xl-line);background:var(--xl-bg);color:var(--xl-ink);cursor:pointer;text-decoration:none;text-align:center}
.xl-btn.pri{background:var(--xl-acc);border-color:var(--xl-acc);color:var(--xl-acc-ink)}
.xl-btn.gold{background:var(--xl-gold);border-color:var(--xl-gold);color:var(--xl-gold-ink)}
.xl-row{display:flex;flex-wrap:wrap;gap:8px}.xl-row>.xl-btn{flex:1 1 140px}
.xl-seg{display:flex;flex-wrap:wrap;gap:6px}
.xl-seg label{flex:1 1 120px;display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 10px;border:1.5px solid var(--xl-line);border-radius:10px;cursor:pointer;font-weight:600;font-size:15px}
.xl-seg label:has(input:checked){border-color:var(--xl-acc);background:var(--xl-soft)}
.xl-seg input,.xl-tick input{width:20px;height:20px;margin:0;accent-color:var(--xl-acc)}
.xl-tick{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px dashed var(--xl-line);border-radius:10px;cursor:pointer;font-size:15px;min-height:44px}
.xl-photo{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.xl-photo img{max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--xl-line)}
.xl-file{position:relative;overflow:hidden}.xl-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.xl-bar{position:fixed;left:8px;right:8px;bottom:8px;z-index:900;background:var(--xl-bg);border:1.5px solid var(--xl-gold);border-radius:12px;padding:8px 10px 8px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;box-shadow:0 4px 18px rgba(0,0,0,.18);max-width:640px;margin:0 auto}
.xl-bar b{font-size:15px}
.xl-picks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.xl-picks a{display:block;padding:10px 12px;border:1.5px solid var(--xl-line);border-radius:10px;color:var(--xl-ink);text-decoration:none;min-height:44px}
.xl-picks a:hover{border-color:var(--xl-acc)}
.xl-shot{font-size:13px;color:var(--xl-muted)}
body.xl-lock{overflow:hidden}
body:has(.xl-bar){padding-bottom:84px}
</style>
<script>
/* What it does (the plan is in Mr Sawyer's private teaching notes; storage keys are in the README, "Extension log"):
   - one student name for the whole site (mathsSite.name.v1; Maths Practice's own name carries over and is kept in step)
   - a quest or stretch link "starts" when the student taps its link, or Start on a quest with no link. The visit is saved
     (mathsSite.away.v1) so the box "What did you do?" appears on ANY page of the site they open next, however much later.
     The clock stops at 45 minutes ("45 min+"). Only one at a time: they answer the last one before starting another.
   - "Done it" goes through the same box. The box asks: Completed it / Not completed, what kind of work (website, book, both),
     the date tick for book work, an optional note and an optional photo. Completed with no photo shows as "not verified".
   - answers go in the shared extension record (mathsSite.ext.v1 → log, last 400). Photos are shrunk on the device and kept
     in mathsSite.photos.v1: the last 10 days, at most 10, always the newest one. A pruned photo's entry still says one was added.
   - turn-taking nudges: after a screen quest, "Next one on paper"; starting a screen quest straight after one, "Try a paper one?"
   Each page tells it about its quests with XL.describe(id) → {src, id, nm, mode: 'paper'|'screen', url?, how?, rec?: {label}},
   and may set XL.onLog(entry), XL.onChange(), XL.paperPicks() → [{nm, href}], XL.showPaper(). Nothing is sent anywhere. */
(function () {
  'use strict';
  const KN = 'mathsSite.name.v1', KV = 'mathsSite.away.v1', KE = 'mathsSite.ext.v1', KP = 'mathsSite.photos.v1';
  const CAP = 45 * 60, PHOTO_DAYS = 10, PHOTO_MAX = 10, PX = 800, Q = 0.6;
  const SHOT = 'Screenshot where you got to before you come back.';
  const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const p2 = n => String(n).padStart(2, '0');
  const dayOf = t => { const x = new Date(t); return x.getFullYear() + '-' + p2(x.getMonth() + 1) + '-' + p2(x.getDate()); };
  const hm = t => { const x = new Date(t); return p2(x.getHours()) + ':' + p2(x.getMinutes()); };
  const mins = s => s == null ? '' : s >= CAP ? '45 min+' : s < 60 ? 'under a minute' : Math.round(s / 60) + ' min';
  const KIND = {site: 'On the website', book: 'Written in my book', both: 'Both'};
  let root = null, left = false, box = null, ready = false;

  const XL = {
    SHOT, KIND, mins, describe: () => null, onLog: null, onChange: null, paperPicks: null, showPaper: null, noAsk: false,
    name() { const n = get(KN, ''); if (n) return n; const p = get('mathsPractice.v1', null); return p && p.name ? p.name : ''; },
    setName(n) { n = String(n || '').trim().slice(0, 40); if (n) put(KN, n); return n; },
    log() { const o = get(KE, null); return o && Array.isArray(o.log) ? o.log : []; },
    entries(src) { return XL.log().filter(e => !src || e.src === src); },
    visit() { return get(KV, null); },
    photo(t) { const p = get(KP, []).find(x => x.t === t); return p ? p.data : null; },
    lastMode() { const L = XL.log(); return L.length ? L[L.length - 1].mode : ''; },
    // a quest, started from a link (url) or a Start button; force skips the "try a paper one" nudge
    start(v, force) {
      if (!v) return false;
      const cur = XL.visit();
      if (cur && cur.id === v.id && cur.src === v.src) { if (v.url) { left = false; } return true; }   // the same one again: the clock keeps running
      if (cur) { showBox(); return false; }                                                                // the last one first
      if (!force && v.mode === 'screen' && XL.lastMode() === 'screen') { nudgeStart(v); return false; }
      put(KV, Object.assign({}, v, {t: Date.now(), at: location.pathname}));
      left = false; bar(); changed(); return true;
    },
    // "Done it", "Done today", or "I've stopped": the box, now. Not started first: the box says it wasn't timed.
    finish(v) {
      const cur = XL.visit();
      if (!cur && v) put(KV, Object.assign({}, v, {t: Date.now(), untimed: true, at: location.pathname}));
      else if (cur && v && (cur.id !== v.id || cur.src !== v.src)) { showBox(); return; }
      showBox(true);
    },
    adopt(v) { if (v && !XL.visit()) put(KV, v); },   // an older page's visit in progress, moved over
    unlog(src, id) {   // Undo: take back the last "Completed" for this quest
      const o = get(KE, {log: []}); if (!Array.isArray(o.log)) return false;
      for (let i = o.log.length - 1; i >= 0; i--) if (o.log[i].src === src && o.log[i].id === id && o.log[i].ok) {
        const t = o.log[i].t; o.log.splice(i, 1); put(KE, o); put(KP, get(KP, []).filter(p => p.t !== t)); return true; }
      return false;
    },
    prune, pruneSaved, showBox, askName, render: () => { bar(); }
  };
  window.XL = XL;
  function changed() { if (XL.onChange) try { XL.onChange(); } catch (e) {} }

  /* ---- the bar while a quest is open on this page ---- */
  function bar() {
    if (!root) return;
    const v = XL.visit(), b = root.querySelector('.xl-bar');
    if (!v || box) { if (b) b.remove(); return; }
    const h = `<div><b>⏱ ${E(v.nm)}</b><div class="xl-m">${v.untimed ? 'Not timed' : 'Started at ' + hm(v.t)}${v.url ? '' : ' · on paper'}</div></div><button class="xl-btn gold" data-xl="stop">${v.url ? 'Tell me how it went' : "I've stopped"}</button>`;
    if (b) b.innerHTML = h; else root.insertAdjacentHTML('beforeend', `<div class="xl-bar" role="status">${h}</div>`);
  }

  /* ---- modal helper ---- */
  function modal(html, label) {
    root.querySelectorAll('.xl-ov').forEach(x => x.remove());
    root.insertAdjacentHTML('beforeend', `<div class="xl-ov"><div class="xl-dlg" role="dialog" aria-modal="true" aria-labelledby="${label}">${html}</div></div>`);
    document.body.classList.add('xl-lock'); const d = root.querySelector('.xl-dlg'); d.tabIndex = -1; d.focus({preventScroll: true});
    const bb = root.querySelector('.xl-bar'); if (bb) bb.remove();
  }
  function close() { root.querySelectorAll('.xl-ov').forEach(x => x.remove()); document.body.classList.remove('xl-lock'); box = null; bar(); }

  /* ---- the name, asked once for the whole site ---- */
  function askName(after) {
    modal(`<h2 id="xlnh">What's your name?</h2><p class="xl-m">So anyone looking at your record can see whose it is. It stays on this device.</p>
      <label class="xl-lab">First name and the first letter of your surname<input type="text" id="xlname" maxlength="40" autocomplete="off" placeholder="For example: Sam T"></label>
      <div class="xl-row"><button class="xl-btn pri" data-xl="name">Save</button></div>`, 'xlnh');
    box = {name: true, after};
  }

  /* ---- the box: what did you do? ---- */
  function showBox(now) {
    const v = XL.visit(); if (!v || !root) return;
    if (!XL.name() && !XL.noAsk) { askName(() => showBox(now)); return; }
    if (box && box.v) return;
    const gone = v.untimed ? null : Math.max(0, Math.round((Date.now() - v.t) / 1000)), secs = gone == null ? null : Math.min(gone, CAP);
    const kind = v.mode === 'paper' ? 'book' : 'site', nm = XL.name();
    box = {v, secs, cap: gone != null && gone >= CAP, photo: null};
    modal(`<p class="xl-m">${nm ? E(nm) + ' · ' : ''}${v.untimed ? "Not timed: you didn't start it here first" : (now ? 'Time on it: ' : 'Welcome back · time on it: ') + mins(secs)}</p>
      <h2 id="xlbh">What did you do on ${E(v.nm)}?</h2>
      ${v.how ? `<p style="font-size:15px"><b>To finish:</b> ${E(v.how)}</p>` : ''}
      ${v.rec ? `<label class="xl-lab">${E(v.rec.label)} <span class="xl-m">(if you finished)</span><input type="number" step="any" id="xlv" inputmode="decimal"></label>` : ''}
      <fieldset style="border:0;margin:0;padding:0"><legend class="xl-lab" style="margin-bottom:6px">What kind of work was it?</legend><div class="xl-seg">
      ${Object.keys(KIND).map(k => `<label><input type="radio" name="xlkind" value="${k}"${k === kind ? ' checked' : ''}>${KIND[k]}</label>`).join('')}</div></fieldset>
      <label class="xl-tick" id="xltickw"><input type="checkbox" id="xldated"><span>I wrote today's date and the quest's name in my book.</span></label>
      <label class="xl-lab">What did you get done? <span class="xl-m">(optional)</span><input type="text" id="xlnote" maxlength="140" autocomplete="off" placeholder="For example: got to level 3"></label>
      <div class="xl-photo">${photoHTML(v)}</div>
      <div class="xl-row"><button class="xl-btn gold" data-xl="ok">✓ Completed it</button><button class="xl-btn" data-xl="no">Not completed</button></div>
      <p class="xl-m">This goes in your record. Choose one to carry on.</p>`, 'xlbh');
    tick();
  }
  function photoHTML(v) { return `<span class="xl-btn xl-file">📷 Add a photo<input type="file" id="xlfile" accept="image/*" aria-label="Add a photo"></span><span class="xl-m" id="xlph">${v.mode === 'paper' ? 'A photo of your book page' : 'A screenshot of where you got to'}. Optional, but without one it shows as "not verified".</span>`; }
  function tick() { const k = (root.querySelector('input[name=xlkind]:checked') || {}).value, w = root.querySelector('#xltickw'); if (w) w.style.display = k === 'site' ? 'none' : ''; }
  function answer(ok) {
    const v = box.v, q = s => root.querySelector(s), note = (q('#xlnote').value || '').trim(), kind = (q('input[name=xlkind]:checked') || {}).value || (v.mode === 'paper' ? 'book' : 'site');
    const raw = q('#xlv') ? q('#xlv').value : '', t = Date.now();
    const e = {t, d: dayOf(t), id: v.id, nm: v.nm, ok, res: ok ? 'Completed' : 'Not completed', secs: box.secs, src: v.src, mode: v.mode || 'screen', kind, start: v.untimed ? null : v.t};
    if (kind !== 'site') e.dated = !!q('#xldated').checked;
    if (box.cap) e.cap = true;
    if (v.untimed) e.untimed = true;
    if (note) e.note = note;
    if (ok && raw !== '' && !isNaN(+raw)) e.v = +raw;
    let msg = '';
    if (box.photo) { const P = get(KP, []); P.push({t, d: e.d, data: box.photo}); if (put(KP, prune(P))) e.photo = true; else { e.photo = false; msg = "Your photo couldn't be saved: this device is full. Everything else is saved."; } }
    else e.photo = false;

  $('#app').innerHTML = ({home: homeHTML, race: raceHTML, angles: angHTML, record: recordHTML})[V.view]();
  if (V.view === 'angles') angAfter();
  const atHome = V.view === 'home', extra = history.state && history.state.mg;
  try { if (!atHome && !extra) history.pushState({mg: 1}, ''); else if (atHome && extra) history.back(); } catch (e) {}
}
function backBtn() {
  if (V.view === 'race' && V.r.ph === 'run') { const R = V.r, o = R.i >= 0 ? RC.opp[R.i] : null;
    addRec({id: 'race', nm: o ? 'Race: the ' + o.nm : `Race: ${R.N} questions`, ok: false, res: 'Stopped early', secs: +((rClock() - R.t0) / 1000).toFixed(1), sc: R.right, n: R.N, slips: R.slips, fx: factsTag()}); save(); }
  if (V.view === 'race' && V.r.ph !== 'pick') { V.r = racePick(); render(); window.scrollTo(0, 0); return; }
  if (V.view === 'angles' && V.a.ph !== 'menu') { if (angAsk() && !V.a.ask) { V.a.ask = true; render(); window.scrollTo(0, 0); return; } angMenu(); return; }
  V = {view: 'home'}; render(); window.scrollTo(0, 0);
}
addEventListener('popstate', () => { if (V.view !== 'home') backBtn(); });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, s = G.rset;
  switch (a) {
    case 'up': backBtn(); break;
    case 'race': raceMenu(); break;
    case 'rec': V = {view: 'record'}; render(); window.scrollTo(0, 0); break;
    case 'recall': V.all = !V.all; render(); break;
    case 'rfriend': V.r.friend = el.dataset.f === '1'; render(); break;
    case 'rop': { const o = el.dataset.o; s.ops = s.ops.includes(o) ? s.ops.filter(x => x !== o) : Object.keys(OPS).filter(x => x === o || s.ops.includes(x)); save(); render(); break; }
    case 'rscope': s.scope = el.dataset.s; if (s.scope === 'pick' && !s.fam.some(id => s.ops.includes(FBY[id]?.op))) s.fam = s.fam.concat(s.ops.flatMap(o => real(o).map(f => f.id))); save(); render(); break;
    case 'rfam': { const id = el.dataset.f; s.fam = s.fam.includes(id) ? s.fam.filter(x => x !== id) : s.fam.concat(id); save(); render(); break; }
    case 'rlist': V.r = racePick(); render(); window.scrollTo(0, 0); break;
    case 'rgo': raceStart(+el.dataset.i, +el.dataset.n || 0); window.scrollTo(0, 0); break;
    case 'rkey': raceKey(el.dataset.k); break;
    case 'aleave': { const A = V.a; if (A.ph === 'daily') addRec({id: 'angle-day', nm: 'Angle guesser: one angle (practice)', ok: false, res: 'Stopped early', secs: angSecs(A)});
      else addRec({id: 'angle-round', nm: `Angle guesser: ${ANG_T[A.tier].name} (practice)`, ok: false, res: `Stopped early (${A.ans.length} of ${AR.round})`, secs: angSecs(A)}); save(); angMenu(); break; }
    case 'angles': case 'amenu': angMenu(); break;
    case 'astay': V.a.ask = false; render(); break;
    case 'atier': G.ang.tier = el.dataset.t; save(); render(); break;
    case 'around': angRoundStart(el.dataset.m); break;
    case 'adaily': angDailyStart('today'); break;
    case 'adprac': angDailyStart('practice'); break;
    case 'akey': angKey(el.dataset.k); break;
    case 'anext': angNext(); break;
    case 'gcopy': gCopy(); break;
  }
});
document.addEventListener('keydown', e => {
  if (V.view === 'race' && V.r.ph === 'run') { if (/^\d$/.test(e.key)) raceKey(e.key); else if (e.key === 'Backspace') raceKey('⌫'); }
  if (V.view === 'angles') {
    if (/^\d$/.test(e.key)) angKey(e.key); else if (e.key === 'Backspace') angKey('⌫');
    else if (e.key === 'Enter') { e.preventDefault(); if (V.a.ph === 'rev') angNext(); else angKey('ok'); }
  }
});
addEventListener('pagehide', save);
render();
</script>
